/* ================= 2.3 交換 ================= */
const swA=$('#swA'), swB=$('#swB');
const trTemp=makeTracer({mount:$('#trTemp'), order:['A','B','temp'], noConsole:true, build(){
  const a=int(swA,-999,999,3), b=int(swB,-999,999,8), r=Rec();
  const lines=['A = '+a,'B = '+b,'','# 例子：使用暫存變量的標準交換','temp = A','A = B','B = temp'];
  r.V.A=a; r.rec(0,'A = '+a+'。'); r.V.B=b; r.rec(1,'B = '+b+'。');
  r.V.temp=a; r.rec(4,'把 A 的值 '+a+' <b>複製</b>到暫存變量 temp——先把 A 的數據保護好。',{move:{from:'A',to:'temp',val:a}});
  r.V.A=b; r.rec(5,'把 B 的值 '+b+' 放入 A。A 原本的 '+a+' 被覆蓋，但它已安全地存在 temp。',{move:{from:'B',to:'A',val:b}});
  r.V.B=a; r.rec(6,'把 temp 的值 '+a+' 放入 B。',{move:{from:'temp',to:'B',val:a}});
  r.end('✔ 交換成功：A = '+b+'，B = '+a+'。沒有任何數據丟失。');
  return {lines, steps:r.S};
}});
const trWrong=makeTracer({mount:$('#trWrong'), order:['A','B'], noConsole:true, sideExtra:true, build(){
  const a=int(swA,-999,999,3), b=int(swB,-999,999,8), r=Rec();
  const lines=['A = '+a,'B = '+b,'','A = B','B = A      # ✘ 錯誤示範'];
  r.V.A=a; r.rec(0,'A = '+a+'。'); r.V.B=b; r.rec(1,'B = '+b+'。');
  r.V.A=b; r.rec(3,'A = B：A 變成 '+b+'。A 原本的 <b>'+a+'</b> 被覆蓋，<b>永久遺失</b>！',{move:{from:'B',to:'A',val:b},lost:a});
  r.V.B=b; r.rec(4,'B = A：B 只能得到 A <b>現在</b>的值 '+b+'。',{move:{from:'A',to:'B',val:b},lost:a});
  r.end(a===b?'兩個值本來相同，看不出問題——試試輸入兩個不同的數字。':'✘ 交換失敗：A = '+b+'，B = '+b+'，原本的 '+a+' 已經找不回來。',{lost:a});
  return {lines, steps:r.S};
}, extra(st, ex){ ex.innerHTML = st&&st.lost!==undefined ? '<div class="warn">🗑 遺失的數據：<b class="mono" style="text-decoration:line-through">'+st.lost+'</b></div>' : ''; }});
$('#swGo').addEventListener('click',()=>{ trTemp.rebuild(); trWrong.rebuild(); });
const mxX=$('#mxX'), mxY=$('#mxY');
const trMath=makeTracer({mount:$('#trMath'), order:['x','y'], noConsole:true, build(){
  const x=int(mxX,-999,999,6), y=int(mxY,-999,999,2), r=Rec(), s=x+y;
  const lines=['x = '+x,'y = '+y,'','# 例子：數學交換（無暫存變量）','x = x + y','y = x - y','x = x - y'];
  r.V.x=x; r.rec(0,'x = '+x+'。'); r.V.y=y; r.rec(1,'y = '+y+'。');
  r.V.x=s; r.rec(4,'x = x + y → '+x+' + '+y+' = <b>'+s+'</b>（x 暫時存放兩數之和）。');
  r.V.y=s-y; r.rec(5,'y = x - y → '+s+' − '+y+' = <b>'+x+'</b>（y 得到原本的 x）。');
  r.V.x=s-x; r.rec(6,'x = x - y → '+s+' − '+x+' = <b>'+y+'</b>（x 得到原本的 y）。');
  r.end('✔ 交換成功：x = '+y+'，y = '+x+'。沒有用第三個變量，但第一步的和 '+s+' 必須放得進變量之內。');
  return {lines, steps:r.S};

/* ================= 2.3 溢出 ================= */
function ovRun(){
  const x=int($('#ovX'),-128,127,100), y=int($('#ovY'),-128,127,50);
  const inR=v=>v>=-128&&v<=127; let X=x,Y=y,bad=false,pinV=null; const L=[];
  const steps=[['x = x + y',()=>X+Y,v=>X=v,()=>X+' + '+Y],['y = x - y',()=>X-Y,v=>Y=v,()=>X+' − '+Y],['x = x - y',()=>X-Y,v=>X=v,()=>X+' − '+Y]];
  L.push('<div>x = '+x+'，y = '+y+'</div>');
  steps.forEach(s=>{ if(bad){ L.push('<div class="skip">'+s[0]+'（不會執行）</div>'); return; }
    const expr=s[3](), v=s[1](); pinV=v;
    if(!inR(v)){ bad=true; L.push('<div class="bad">'+s[0]+' → '+expr+' = '+v+'，超出 −128 至 127</div>'); }
    else { s[2](v); L.push('<div class="ok">'+s[0]+' → '+expr+' = '+v+'</div>'); } });
  L.push(bad?'<div class="bad" style="border-style:solid">結果：交換失敗，程式出錯</div>':'<div class="ok">結果：x = '+X+'，y = '+Y+'，交換成功</div>');
  $('#ovLines').innerHTML=L.join('');
  const m=$('#ovMeter'); m.classList.toggle('over',bad);
  const pv=Math.max(-128,Math.min(127,pinV==null?0:pinV)); $('#ovPin').style.left=((pv+128)/255*100)+'%';

const BOOL={'true':'true','t':'true','真':'true','是':'true','false':'false','f':'false','假':'false','否':'false'};
const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/[“”「」]/g,'"');
const same=(u,a)=>{ let x=norm(u),y=norm(a); x=BOOL[x]||x; y=BOOL[y]||y; return x!==''&&x===y; };
const SC={};
function navScore(){ Object.keys(SC).forEach(k=>{ const b=$('[data-score="'+k+'"]'); if(b) b.textContent='⭐ '+SC[k].ok+'/'+SC[k].n; }); }
function shuffleDiff(n){ const base=[...Array(n).keys()]; let a; let guard=0; do{ a=base.slice(); for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }while(n>1 && a.every((v,i)=>v===i) && ++guard<20); return a; }

const RENDER={
  mcq(q,body,done){

    body.addEventListener('click',e=>{ const b=e.target.closest('.opt'); if(!b) return; const i=+b.dataset.i;
      $$('.opt',body).forEach(x=>x.classList.remove('sel-ok','sel-bad')); const ok=i===q.answer; b.classList.add(ok?'sel-ok':'sel-bad');

  fill(q,body,done){

      '<div class="fill-row"><label>你的答案：<input type="text" autocomplete="off" spellcheck="false"></label><button class="btn primary">提交</button></div>';
    const inp=$('input',body);
    const go=()=>{ const ok=q.answer.some(a=>same(inp.value,a)); done(ok, ok?'':(inp.value.trim()?'你填了「'+esc(inp.value.trim())+'」。':'請先填寫答案。')); };

  },
  trace(q,body,done){
    let h=(q.code?staticCode(q.code):'')+'<div class="twrap"><table class="t"><thead><tr>'+q.cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
    q.rows.forEach(r=>{ h+='<tr>'+r.map(c=>typeof c==='object'?'<td><input class="tin" data-a="'+esc(c.a)+'" autocomplete="off" spellcheck="false" aria-label="追蹤表空格"></td>':'<td class="mono">'+esc(c)+'</td>').join('')+'</tr>'; });
    h+='</tbody></table></div><p class="legend">True / False 可寫 T / F。</p><button class="btn primary">提交追蹤表</button>';
    body.innerHTML=h;
    $('.btn',body).addEventListener('click',()=>{ let wrong=0;
      $$('.tin',body).forEach(t=>{ const ok=same(t.value,t.dataset.a); t.classList.toggle('ok',ok); t.classList.toggle('bad',!ok);
        let s=t.parentNode.querySelector('.should'); if(s) s.remove();
        if(!ok){ wrong++; s=el('span','should','✘ 應為 '+esc(t.dataset.a)); t.parentNode.appendChild(s); } });
      done(wrong===0, wrong?'有 '+wrong+' 格不正確，已在格下標示正確答案。':''); });
  },
  parsons(q,body,done){
    const order=shuffleDiff(q.lines.length);
    body.innerHTML=(q.prefix?'<div class="legend">已給出的開頭（不用移動）：</div>'+staticCode(q.prefix):'')+
      '<div class="legend">用 ⠿ 拖動，或用 ▲▼ 調整次序（縮排已給出）：</div><ol class="parsons">'+
      order.map(k=>'<li data-k="'+k+'"><span class="handle" aria-hidden="true">⠿</span><pre>'+hl(q.lines[k])+'</pre><button class="mv" data-m="-1" aria-label="上移">▲</button><button class="mv" data-m="1" aria-label="下移">▼</button></li>').join('')+
      '</ol><button class="btn primary">提交次序</button>';
    const ul=$('ol',body); let drag=null;
    ul.addEventListener('click',e=>{ const m=e.target.closest('.mv'); if(!m) return; const li=m.closest('li');
      if(m.dataset.m==='-1'&&li.previousElementSibling) ul.insertBefore(li,li.previousElementSibling);
      else if(m.dataset.m==='1'&&li.nextElementSibling) ul.insertBefore(li.nextElementSibling,li); m.focus(); });
    ul.addEventListener('pointerdown',e=>{ const h=e.target.closest('.handle'); if(!h) return; drag=h.closest('li'); drag.classList.add('dragging'); try{h.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); });
    ul.addEventListener('pointermove',e=>{ if(!drag) return; const y=e.clientY; let before=null;
      for(const it of Array.from(ul.children)){ if(it===drag) continue; const r=it.getBoundingClientRect(); if(y<r.top+r.height/2){ before=it; break; } }
      if(before){ if(drag.nextElementSibling!==before) ul.insertBefore(drag,before); } else if(ul.lastElementChild!==drag) ul.appendChild(drag); });
    const end=()=>{ if(drag){ drag.classList.remove('dragging'); drag=null; } };
    ul.addEventListener('pointerup',end); ul.addEventListener('pointercancel',end);
    $('.btn',body).addEventListener('click',()=>{ const lis=Array.from(ul.children); let ok=true;
      lis.forEach((li,i)=>{ const good=q.lines[+li.dataset.k]===q.lines[i]; li.classList.toggle('ok',good); li.classList.toggle('bad',!good); if(!good) ok=false; });

  },

function practice(mount,key,Q){
  const head=el('div','pscore'); mount.appendChild(head);
  const state=Q.map(()=>null);
  function upd(){ const ok=state.filter(x=>x===true).length, n=state.filter(x=>x!==null).length;
    const best=Math.max(store.get('ictC2-'+key,0), ok); store.set('ictC2-'+key,best);
    SC[key]={ok,n:Q.length};
    head.innerHTML='<span class="big">🎯 得分 '+ok+' / '+Q.length+'</span><span>已作答 '+n+' 題</span><span class="dim">最佳紀錄：'+best+' / '+Q.length+'</span><span class="dim">答錯可以再試，得分以最新作答計算。</span>';
    navScore(); }
  Q.forEach((q,qi)=>{
    const card=el('div','qcard','<div class="qhead"><span class="qno">第 '+(qi+1)+' 題</span><span class="qtype">'+TYPE[q.type]+'</span></div><div class="qtext">'+q.q+'</div>');
    const body=el('div','qbody'), fb=el('div','fb'); fb.setAttribute('aria-live','polite');
    card.appendChild(body); card.appendChild(fb); mount.appendChild(card);
    RENDER[q.type](q,body,(ok,msg)=>{ state[qi]=ok; fb.className='fb '+(ok?'ok':'bad');
      fb.innerHTML=(ok?'<b>✔ 答對！</b> ':'<b>✘ 未答對。</b> ')+(msg||'')+'<div class="exp">📘 '+q.explain+'</div>';
      card.classList.toggle('is-ok',ok); card.classList.toggle('is-bad',!ok); upd(); });
  });
  upd();
}

  { id: 'ch8', no: 8, name: '分析及選擇算法', ready: false },
  { id: 'ch9', no: 9, name: '編程在日常生活中的應用', ready: false },
  { id: 'ex', no: 0, name: '綜合練習', ready: false }
];
(function () {
  document.getElementById('indexLink').href = CONFIG.INDEX_URL;
  const ready = CHAPTERS.filter(c => c.ready && document.getElementById('src-' + c.id));
  const tabs = document.getElementById('tabs'), stage = document.getElementById('stage'), frames = {};
  ready.forEach(c => {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.id = c.id;
    b.textContent = `第 ${c.no} 章 · ${c.theme}`; b.title = c.name;
    b.addEventListener('click', () => show(c.id, true)); tabs.appendChild(b);
  });
  const left = CHAPTERS.filter(c => !c.ready).length;
  if (left) { const s = document.createElement('span'); s.className = 'soon'; s.textContent = '其餘章節製作中'; tabs.appendChild(s); }
  function show(id, push) {
    const c = ready.find(x => x.id === id) || ready[0]; if (!c) return;
    if (!frames[c.id]) {
      const f = document.createElement('iframe'); f.title = `第 ${c.no} 章 ${c.name}`;
      // 還原內嵌時轉義過的標記
      f.srcdoc = document.getElementById('src-' + c.id).textContent.replace(/<\\\/script/gi, '</script').replace(/<\\!--/g, '<!--');
      stage.appendChild(f); frames[c.id] = f;
    }
    Object.entries(frames).forEach(([k, f]) => f.classList.toggle('on', k === c.id));
    tabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.id === c.id ? 'true' : 'false'));
    document.getElementById('crumb').textContent = `選修 C · 第 ${c.no} 章 · ${c.name}`;
    document.title = `選修 C 第 ${c.no} 章 · ${c.name}`;
    if (push) { try { history.replaceState(null, '', '#' + c.id); } catch (e) {} }
    frames[c.id].focus();
  }
  window.addEventListener('hashchange', () => show(location.hash.slice(1), false));
  show((location.hash || '#ch1').slice(1), false);
})();
</script>
