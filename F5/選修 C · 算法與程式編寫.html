<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選修 C 第 1 章 · 專業程式設計基礎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --floor:#d8d4c7; --floor-dot:#c9c4b4; --paper:#f0ede4; --paper2:#e6e2d6;
  --ink:#161616; --ink2:#3b3b37; --steel:#2c3238; --steel2:#48515a;
  --yellow:#f2c214; --yellow-soft:#f7de7a; --orange:#c94a17; --ok:#1c6a34; --bad:#a8231b;
  --card:#c49a5c; --card-dark:#8a6532; --code:#1b1d1f; --codefg:#ecebe4; --codedim:#9b9a92;
  --mono:"IBM Plex Mono",Consolas,Menlo,"Courier New",monospace;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif;
  --stencil:"Big Shoulders Stencil Display",Impact,"Arial Narrow",sans-serif;
  --fs-scale:1;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(clamp(16px, .6vw + 10.5px, 23px) * var(--fs-scale)); scroll-behavior:smooth; -webkit-text-size-adjust:100%}
body{margin:0; color:var(--ink); font-family:var(--sans); line-height:1.6; overflow-x:hidden;
  background-color:var(--floor);
  background-image:radial-gradient(var(--floor-dot) 1px, transparent 1.4px), radial-gradient(var(--floor-dot) 1px, transparent 1.4px);
  background-size:23px 23px, 37px 37px; background-position:0 0, 11px 17px;}
code,pre,.mono,kbd,samp,textarea.mono,input.mono{font-family:var(--mono); font-variant-ligatures:none; font-feature-settings:"liga" 0,"calt" 0}
h1,h2,h3,h4{line-height:1.25; margin:.2em 0 .5em}
a{color:inherit}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px dashed var(--orange); outline-offset:3px}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.hazard{background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,var(--ink) 14px 28px)}

/* ===== 系列橫額 ===== */
.series{background:var(--ink); color:#f3f1ea; font-size:.82rem; display:flex; align-items:center; gap:1rem; padding:.35rem 1rem; flex-wrap:wrap}
.series a{color:var(--yellow); text-decoration:none; font-weight:700}
.series a:hover,.series a:focus-visible{text-decoration:underline}
.series .tools{margin-left:auto; display:flex; gap:.5rem; flex-wrap:wrap}
.tog{background:transparent; color:#f3f1ea; border:2px solid #77746a; padding:.1rem .6rem; cursor:pointer; font-size:.8rem; min-height:36px}
.tog[aria-pressed="true"]{border-color:var(--yellow); color:var(--yellow)}

/* ===== 封面 ===== */
.hero{max-width:1100px; margin:0 auto; padding:1.6rem 1rem .8rem; text-align:center}
.hero .kicker{font-family:var(--stencil); letter-spacing:.14em; color:var(--ink2); font-size:1rem}
.hero h1{font-size:clamp(2rem,3.6vw,3.2rem); font-weight:900; margin:.1em 0 .2em; letter-spacing:.06em}
.hero h1 .plate{display:inline-block; background:var(--yellow); border:3px solid var(--ink); padding:0 .3em; margin-right:.25em}
.hero p{margin:.2rem auto; max-width:44em; color:var(--ink2)}

/* ===== 分區按鈕 ===== */
.zones{display:flex; justify-content:center; gap:.8rem; flex-wrap:wrap; padding:.8rem 1rem; position:sticky; top:0; z-index:40; background:var(--floor); border-bottom:3px solid var(--ink)}
.zone{position:relative; background:var(--paper); border:3px solid var(--ink); padding:.35rem 1rem; cursor:pointer; text-align:left; min-height:52px}
.zone b{display:block; font-size:1.02rem}
.zone small{font-family:var(--stencil); letter-spacing:.12em; color:var(--ink2)}
.zone[aria-current="true"]{background:var(--yellow); box-shadow:4px 4px 0 var(--ink)}
.zone[aria-current="true"] b::before{content:"▶ "}
.zone .badge{position:absolute; top:-.75rem; right:-.5rem; background:var(--ink); color:var(--yellow); font-size:.72rem; padding:0 .4rem; font-weight:700; font-family:var(--mono)}

main{max-width:1180px; margin:0 auto; padding:0 1rem 3rem}
.sec{display:none; scroll-margin-top:6rem}
.sec.on{display:block}
.sec-banner{text-align:center; margin:1.4rem 0 .6rem}
.sec-banner h2{display:inline-block; font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:900; margin:0; border-bottom:6px solid var(--yellow); padding:0 .2em}
.sec-banner p{margin:.4rem 0 0; color:var(--ink2)}
.chips{display:flex; justify-content:center; flex-wrap:wrap; gap:.5rem; margin:.6rem 0 1.2rem}
.chips button{background:transparent; border:2px dashed var(--ink2); padding:.25rem .8rem; cursor:pointer; min-height:42px}
.chips button:hover{border-style:solid; background:var(--paper)}

/* ===== 每個重點一張卡 ===== */
.card{background:var(--paper); border:3px solid var(--ink); margin:2rem 0 1.6rem; position:relative; padding:1.5rem 1.2rem 1.1rem; scroll-margin-top:6.5rem; min-width:0}
.card-tag{position:absolute; top:-1rem; left:1rem; background:var(--yellow); border:3px solid var(--ink); padding:0 .7rem; font-weight:900; font-size:1.02rem}
.book{border-left:8px solid var(--ink); background:var(--paper2); padding:.45rem .9rem; margin:0 0 1rem}
.book::before{content:"課本"; display:inline-block; font-size:.75rem; font-weight:900; background:var(--ink); color:#fff; padding:0 .35rem; margin-bottom:.2rem}
.book ul{margin:.1rem 0 0; padding-left:1.2em}
.book li{margin:.15rem 0}
.book table{border-collapse:collapse; margin:.5rem 0 .2rem; font-size:.95rem}
.book th,.book td{border:2px solid var(--ink); padding:.2rem .6rem; text-align:left; vertical-align:top}
.book th{background:var(--ink); color:#fff}
.try{font-weight:900; margin:.2rem 0 .5rem}
.try::before{content:"試一試 ▸ "; color:var(--ink2)}
.takeaway{border:2px solid var(--ink); background:#fffdf5; padding:.45rem .8rem; margin-top:1rem; font-weight:700}
.takeaway::before{content:"重點："; background:var(--yellow); padding:0 .3rem; margin-right:.3rem}
.hint{font-size:.9rem; color:var(--ink2)}
.ctl{display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; margin-bottom:.8rem}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1rem}
.callout{border:2px solid var(--ink); background:var(--yellow-soft); padding:.5rem .8rem; margin:.6rem 0}

/* 按鈕 */
.btn{background:var(--yellow); color:var(--ink); border:3px solid var(--ink); padding:.3rem .8rem; min-height:44px; cursor:pointer; font-weight:700; display:inline-flex; align-items:center; gap:.35em; touch-action:manipulation}
.btn:active{transform:translate(1px,1px)}
.btn.alt{background:var(--paper)}
.btn.dark{background:var(--steel); color:#fff}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--ink); color:var(--yellow)}
.chk{display:inline-flex; align-items:center; gap:.4em; border:2px solid var(--ink); padding:.2rem .6rem; background:var(--paper); cursor:pointer; min-height:44px}
.chk input{width:1.2em; height:1.2em; accent-color:var(--ink)}
.chk.bug{border-style:dashed; background:#f5d2c3}
.field{display:inline-flex; align-items:center; gap:.4em; flex-wrap:wrap}
.field input,.field select{border:2px solid var(--ink); background:#fff; padding:.25rem .45rem; min-height:40px; max-width:100%}

/* ===== 程式碼 ===== */
.codebox{background:var(--code); color:var(--codefg); border:3px solid var(--ink); overflow-x:auto; font-family:var(--mono); font-variant-ligatures:none; font-size:.92rem}
.codetab{border-collapse:collapse; width:100%; font-family:var(--mono); font-variant-ligatures:none}
.codetab td{padding:.08rem .5rem; vertical-align:top; white-space:pre; border-bottom:1px solid #2a2d30}
.codetab .gut{width:1.6em; text-align:center; color:var(--yellow); font-family:var(--sans); font-weight:900}
.codetab .ln{width:2.2em; text-align:right; color:var(--codedim); user-select:none}
.codetab .pc{border-left:2px dashed #555; color:#d9d6c8}
.codetab tr.cur td{background:var(--yellow); color:var(--ink)}
.codetab tr.cur td *{color:var(--ink)!important}
.codetab tr.cur .ln{color:var(--ink); font-weight:700}
.codetab tr.err td{background:#f3c7b4; color:var(--ink); text-decoration:underline wavy var(--bad)}
.codetab tr.err td *{color:var(--ink)!important}
.codetab tr.err .gut{text-decoration:none}
.codetab th{font-family:var(--sans); font-size:.8rem; text-align:left; color:var(--yellow); padding:.2rem .5rem; border-bottom:2px solid #555; font-weight:700}
.k{color:#ffcc66; font-weight:600}.b{color:#8fd3ff}.s{color:#b6e39a}.c{color:#a5a39a; font-style:italic}.n{color:#ffa98a}.cn{color:#ffd8f0; text-decoration:underline dotted}
.pk{color:#ffcc66; font-weight:600}.arr{color:#fff; font-weight:700; font-family:var(--sans); font-size:1.1em}
.pre{margin:0; padding:.6rem .8rem; white-space:pre; overflow-x:auto}

/* ===== 逐步執行器 ===== */
.stepper{min-width:0}
.st-grid{display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:1rem; align-items:start}
.st-codehead{display:flex; justify-content:space-between; align-items:center; gap:.5rem; margin-bottom:.3rem; flex-wrap:wrap}
.st-codehead b{font-size:.95rem}
.viewsw{display:none}
.stepper.novars .st-grid{grid-template-columns:minmax(0,1fr)}
.stepper.novars .console{min-height:2.4rem}
.st-side{display:flex; flex-direction:column; gap:.8rem; min-width:0}
.vars{display:flex; flex-wrap:wrap; gap:.55rem; min-height:4.2rem; align-content:flex-start}
.vars .empty{color:var(--ink2); font-size:.9rem}
.crate{border:3px solid var(--card-dark); background:var(--card); min-width:5.5rem; max-width:100%; position:relative; padding:0 .55rem .35rem; box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.crate .lbl{margin:-2px -.55rem .2rem; background:#fffdf5; border:2px solid var(--ink); font-family:var(--mono); font-variant-ligatures:none; font-size:.78rem; padding:0 .35rem; white-space:nowrap; font-weight:600; overflow-wrap:normal}
.crate .val{font-family:var(--mono); font-variant-ligatures:none; font-size:1.05rem; font-weight:600; word-break:break-all; color:var(--ink)}
.crate.chg{outline:3px solid var(--ink); outline-offset:2px}
.crate.chg::after{content:"★ 剛更新"; position:absolute; right:-.3rem; bottom:-1.05rem; font-size:.7rem; background:var(--ink); color:var(--yellow); padding:0 .3rem; font-weight:700}
.crate.anim{animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-10px)} to{transform:none}}
.console{background:#0f1011; color:#e8e6df; border:3px solid var(--ink); font-family:var(--mono); font-variant-ligatures:none; padding:.4rem .6rem; min-height:3.2rem; font-size:.95rem; white-space:pre-wrap; word-break:break-all}
.console .pr{color:var(--yellow)}
.console .er{color:#ffb4a0; font-weight:600}
.console .new{text-decoration:underline; text-decoration-color:var(--yellow); text-underline-offset:3px}
.boxtitle{font-weight:900; font-size:.92rem; display:flex; align-items:center; gap:.4rem; margin-bottom:.25rem}
.note{border:3px solid var(--ink); background:#fffdf5; padding:.5rem .8rem; margin:.8rem 0 .6rem; min-height:2.8rem; display:flex; gap:.6rem}
.note::before{content:"解說"; font-weight:900; background:var(--ink); color:var(--yellow); padding:0 .4rem; height:fit-content; white-space:nowrap}
.note.err{background:#f6d7ca; border-style:dashed}
.note.err::before{content:"✘ 錯誤"}
.ctrl{display:flex; flex-wrap:wrap; gap:.5rem; align-items:center}
.ctrl .cnt{font-family:var(--mono); font-variant-ligatures:none; font-weight:600; padding:0 .4rem; border:2px solid var(--ink); background:#fff; min-height:44px; display:flex; align-items:center}
.ctrl label{display:inline-flex; align-items:center; gap:.3rem; font-size:.9rem}
.ctrl input[type=range]{width:7rem; accent-color:var(--ink)}
.trace-wrap{overflow-x:auto; margin-top:.5rem; border:2px solid var(--ink); background:#fff; max-height:20rem; overflow-y:auto}
details.trace-box{margin-top:.8rem}
details.trace-box > summary{cursor:pointer; font-weight:900; padding:.3rem 0; list-style:none}
details.trace-box > summary::before{content:"▶ "} details.trace-box[open] > summary::before{content:"▼ "}
.trace{border-collapse:collapse; width:100%; font-family:var(--mono); font-variant-ligatures:none; font-size:.9rem}
.trace th{position:sticky; top:0; background:var(--ink); color:var(--yellow); font-family:var(--sans); padding:.3rem .5rem; text-align:center; font-size:.82rem; white-space:nowrap}
.trace td{border:1px solid #9a968a; padding:.2rem .5rem; text-align:center; white-space:nowrap}
.trace tr.cur td{background:var(--yellow-soft); font-weight:700; border-top:3px solid var(--ink); border-bottom:3px solid var(--ink)}
.trace tr.cur td:first-child::before{content:"▶ "}
.trace tr.fut{display:none}
.trace td.er{color:var(--bad); font-weight:700}
.predict{border:3px dashed var(--ink); background:var(--paper2); padding:.6rem .8rem; margin-bottom:.8rem}
.predict .q{font-weight:900; margin-bottom:.4rem}
.predict .q::before{content:"① 先預測 "; background:var(--ink); color:var(--yellow); padding:0 .35rem; margin-right:.3rem}
.predict .opts{display:flex; flex-wrap:wrap; gap:.5rem}
.opt{border:2px solid var(--ink); background:#fff; padding:.3rem .7rem; cursor:pointer; min-height:44px; text-align:left; font-family:var(--mono); font-variant-ligatures:none; white-space:pre-wrap}
.opt[aria-pressed="true"]{background:var(--ink); color:var(--yellow)}
.opt[aria-pressed="true"]::before{content:"☛ "}
.verdict{margin-top:.5rem; font-weight:700}
.verdict.ok::before{content:"✔ "; } .verdict.no::before{content:"✘ "}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.stamp{display:inline-block; border:3px solid currentColor; padding:.05rem .5rem; font-weight:900; transform:rotate(-2deg); letter-spacing:.05em}
.stamp.ok{color:var(--ok)} .stamp.no{color:var(--bad); border-style:dashed}

/* ===== 重構工作台 ===== */
.refopts{display:flex; flex-wrap:wrap; gap:.5rem; margin:.4rem 0 .7rem}
.shipcheck{display:grid; grid-template-columns:repeat(3,minmax(0,auto)); gap:.6rem; align-items:center; border:3px solid var(--ink); background:#fff; padding:.5rem .8rem; margin:.6rem 0}
.shipcheck .out{font-family:var(--mono); font-variant-ligatures:none; font-size:1.25rem; font-weight:700; border:2px solid var(--ink); padding:.1rem .6rem; background:var(--paper)}
.meter{display:flex; gap:3px; align-items:center}
.meter i{width:1.1rem; height:1.1rem; border:2px solid var(--ink); display:inline-block}
.meter i.on{background:var(--ink)}

/* ===== 整理前後 ===== */
.ba{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1rem}
.ba h4{margin:0 0 .3rem; font-size:1rem}
.steps-list{list-style:none; padding:0; margin:.6rem 0; display:flex; flex-wrap:wrap; gap:.4rem}
.steps-list li{border:2px solid var(--ink2); padding:.1rem .6rem; font-size:.92rem; background:#fff}
.steps-list li.done{border-color:var(--ink); background:var(--ink); color:var(--yellow)}
.steps-list li.done::before{content:"✔ "}
.steps-list li.now{outline:3px solid var(--yellow); outline-offset:1px}
.result{display:flex; flex-wrap:wrap; gap:1rem; align-items:center; border:2px solid var(--ink); background:#fff; padding:.5rem .8rem; margin-top:.8rem}
.result .out{font-family:var(--mono); font-variant-ligatures:none; font-size:1.2rem; font-weight:700; border:2px solid var(--ink); padding:0 .6rem; background:var(--paper)}
.chg-line{background:rgba(242,194,20,.28); box-shadow:-6px 0 0 var(--yellow)}
.cmt{border:2px solid var(--ink); background:#fff; padding:.6rem .8rem; margin:.6rem 0}
.cmt .copts{display:grid; gap:.4rem; margin-top:.4rem}
.cmt .why{margin-top:.4rem; font-weight:700}
.cmt .why.ok{color:var(--ok)} .cmt .why.no{color:var(--bad)}
.cmt .why.ok::before{content:"✔ "} .cmt .why.no::before{content:"✘ "}
/* ===== 標籤機 ===== */
.labeler{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1rem}
.ship-label{background:#fffdf5; border:3px solid var(--ink); padding:.6rem .8rem; clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.ship-label .bar{height:26px; background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 7px,transparent 7px 9px,var(--ink) 9px 10px,transparent 10px 13px); margin:.3rem 0}
.ship-label input{width:100%; font-size:1.3rem; padding:.3rem .5rem; border:3px solid var(--ink)}
.checks{list-style:none; padding:0; margin:.5rem 0}
.checks li{padding:.25rem .3rem .25rem 2.1rem; position:relative; border-bottom:1px dashed #a8a395}
.checks li::before{position:absolute; left:.2rem; top:.2rem; font-weight:900; width:1.5rem; text-align:center; border:2px solid var(--ink); line-height:1.25}
.checks li.ok::before{content:"✔"; background:var(--ink); color:#fff}
.checks li.no::before{content:"✘"; background:#fff; color:var(--bad); border-style:dashed}
.checks li.na::before{content:"–"}
.pyreact{border:2px solid var(--ink); background:var(--code); color:var(--codefg); padding:.4rem .6rem; font-family:var(--mono); font-variant-ligatures:none; white-space:pre-wrap; word-break:break-all}

/* ===== 風格巡倉 / 找錯 ===== */
.linepick{list-style:none; margin:0; padding:0; background:var(--code); border:3px solid var(--ink)}
.linepick li{display:flex; align-items:stretch; border-bottom:1px solid #2e3134}
.linepick button{flex:1; text-align:left; background:transparent; color:var(--codefg); border:0; padding:.25rem .5rem; cursor:pointer; white-space:pre; overflow-x:auto; font-family:var(--mono); font-variant-ligatures:none; min-height:40px; display:flex; gap:.6rem; align-items:center}
.linepick .ln{color:var(--codedim); width:1.8em; text-align:right; flex:0 0 auto}
.linepick .flag{flex:0 0 auto; width:4.6rem; font-family:var(--sans); font-size:.78rem; font-weight:900; text-align:center}
.linepick li.sel button{background:#3a3016; box-shadow:inset 6px 0 0 var(--yellow)}
.linepick li.sel .flag::before{content:"⚑ 已標記"; color:var(--yellow)}
.linepick li.r-ok .flag::before{content:"✔ 正確"!important; color:#9fe0a8}
.linepick li.r-no .flag::before{content:"✘ 判斷錯"!important; color:#ffb4a0}
.linepick li.r-ok button,.linepick li.r-no button{box-shadow:none}
.explist{list-style:none; padding:0; margin:.6rem 0 0}
.explist li{border:2px solid var(--ink); background:#fff; padding:.35rem .6rem; margin:.35rem 0}
.explist li b.badtag{background:var(--ink); color:var(--yellow); padding:0 .3rem; margin-right:.3rem}
.explist li b.goodtag{border:2px solid var(--ink); padding:0 .3rem; margin-right:.3rem}

/* ===== 貨格 ===== */
.yard{border:3px dashed var(--ink); background:var(--paper2); padding:.6rem; display:flex; flex-wrap:wrap; gap:.6rem; min-height:4.5rem}
.parcel{border:3px solid var(--card-dark); background:var(--card); padding:.35rem .6rem .4rem; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; max-width:20rem; position:relative; box-shadow:2px 2px 0 rgba(0,0,0,.3); font-weight:700; font-size:.95rem}
.parcel small{display:block; font-weight:400; font-family:var(--mono); font-variant-ligatures:none; font-size:.8rem}
.parcel.sel{outline:4px solid var(--ink); outline-offset:2px}
.parcel.sel::after{content:"已選取"; position:absolute; top:-.9rem; right:.3rem; background:var(--ink); color:var(--yellow); font-size:.7rem; padding:0 .3rem}
.parcel.done{cursor:default; background:#d9c49d; border-style:solid}
.parcel.done::before{content:"✔ "; font-weight:900}
.parcel.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ghost{position:fixed; pointer-events:none; z-index:999; opacity:.92; transform:rotate(-3deg)}
.racks{display:grid; grid-template-columns:minmax(0,3fr) minmax(0,5fr) minmax(0,1.3fr); gap:.8rem; margin-top:.8rem}
.rack{border:4px solid var(--steel); border-top-width:10px; background:linear-gradient(#bdb8aa,#bdb8aa) bottom/100% 6px no-repeat, var(--paper2); padding:.4rem .4rem .8rem}
.rack h4{margin:0 0 .4rem; font-size:.95rem; background:var(--steel); color:#fff; padding:.1rem .4rem; display:inline-block}
.slots{display:grid; grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr)); gap:.45rem}
.slot{border:3px dashed var(--ink2); min-height:5.2rem; background:#ece8dc; padding:.3rem; display:flex; flex-direction:column; gap:.3rem; cursor:pointer; position:relative}
.slot .sname{font-weight:900; font-size:.95rem}
.slot .sname i{font-style:normal; font-family:var(--mono); font-variant-ligatures:none; font-size:.75rem; font-weight:400; display:block}
.slot.hov{border-style:solid; background:var(--yellow-soft)}
.slot.ready{border-color:var(--ink)}
.slot .parcel{font-size:.78rem; padding:.2rem .4rem; max-width:none}

/* ===== 堆疊 / 隊列 ===== */
.sq{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1rem}
.stackviz{display:flex; flex-direction:column-reverse; align-items:center; gap:4px; min-height:13rem; border:3px solid var(--ink); border-top:0; background:var(--paper2); padding:.4rem; justify-content:flex-start}
.pallet{width:70%; text-align:center; background:var(--card); border:3px solid var(--card-dark); font-weight:900; padding:.15rem; position:relative}
.pallet.top::after{content:"◀ 頂 (top)"; position:absolute; left:100%; margin-left:.4rem; white-space:nowrap; font-size:.8rem; background:var(--ink); color:var(--yellow); padding:0 .3rem}
.queueviz{display:flex; gap:6px; align-items:center; min-height:5.5rem; border:3px solid var(--ink); background:var(--paper2); padding:.4rem; overflow-x:auto}
.truck{flex:0 0 auto; border:3px solid var(--ink); background:#fff; padding:.2rem .5rem; font-weight:700; position:relative; margin-top:1.2rem}
.truck .pos{position:absolute; top:-1.3rem; left:0; font-size:.72rem; background:var(--ink); color:var(--yellow); padding:0 .3rem; white-space:nowrap}
.oplog{max-height:9rem; overflow-y:auto; margin-top:.5rem}

/* ===== 作用範圍倉 ===== */
.scope{border:3px solid var(--ink); background:#fff; padding:.6rem; margin-top:.8rem}
.board{border:4px double var(--ink); background:#f6eecf; padding:.4rem .6rem .6rem}
.board h4,.bayx h4,.mainx h4{margin:0 0 .4rem; font-size:.98rem; display:flex; gap:.4rem; flex-wrap:wrap; align-items:center}
.pin{font-size:.75rem; border:2px solid var(--ink); padding:0 .3rem; font-weight:700; background:#fff}
.scope-row{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.5fr); gap:.7rem; margin-top:.7rem}
.mainx{border:3px solid var(--ink); padding:.5rem; background:var(--paper2); position:relative}
.bayx{border:4px solid var(--ink); background:repeating-linear-gradient(0deg,transparent 0 30px,rgba(0,0,0,.04) 30px 31px), var(--paper2); padding:.5rem; position:relative; min-height:9rem}
.bayx.closed{background:repeating-linear-gradient(90deg,#9ea3a8 0 6px,#b8bcc0 6px 12px)}
.bayx.closed .shelf{visibility:hidden}
.door{font-weight:900; font-size:.8rem; padding:0 .4rem; border:2px solid var(--ink); background:#fff}
.here{background:var(--ink); color:var(--yellow); font-size:.78rem; padding:0 .4rem; font-weight:900}
.shelf{display:flex; flex-wrap:wrap; gap:.5rem; align-items:flex-start; padding:.3rem 0 .5rem; border-bottom:6px solid var(--steel2); margin-bottom:.4rem; min-height:3.6rem}
.shelf > .sl{flex:0 0 100%; font-size:.78rem; font-weight:700}
.crate.g{border-style:double; border-width:5px}
.crate.p{border-style:dashed}
.crate.in{animation:boxin .7s ease-out}
@keyframes boxin{from{transform:translateX(-160%) rotate(-6deg); opacity:.2} to{transform:none; opacity:1}}
.waybill{border:2px dashed var(--ink); background:#fffdf5; padding:.2rem .5rem; font-family:var(--mono); font-variant-ligatures:none; font-size:.85rem; display:inline-block; margin:.2rem 0}
.lookup{margin-top:.6rem; border:3px dashed var(--bad); background:#f8e0d6; padding:.4rem .6rem; font-weight:700}
.legend{display:flex; flex-wrap:wrap; gap:.8rem; font-size:.85rem; margin-top:.5rem}
.legend span{display:inline-flex; align-items:center; gap:.3rem}
.legend i{display:inline-block; width:1.6rem; height:1rem; background:var(--card)}

/* ===== 練習 ===== */
.drill{border:4px solid var(--ink); background:var(--paper); margin:1.6rem 0}
.drill > .dh{display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; padding:.5rem .9rem; background:var(--steel); color:#fff}
.drill > .dh h3{margin:0; font-size:1.2rem}
.score{margin-left:auto; display:flex; gap:.6rem; flex-wrap:wrap; font-weight:700}
.score span{background:var(--ink); padding:.05rem .5rem; border:2px solid var(--yellow)}
.qs{padding:.8rem; display:grid; gap:1rem}
.q{border:3px solid var(--ink); background:#fff; padding:.7rem .9rem; min-width:0}
.q .qh{display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin-bottom:.4rem}
.q .qn{font-family:var(--stencil); font-weight:900; font-size:1.3rem; background:var(--yellow); border:2px solid var(--ink); padding:0 .4rem; line-height:1.3}
.q .qt{font-size:.8rem; font-weight:700; border:2px solid var(--ink); padding:0 .4rem}
.q .qstat{margin-left:auto; font-size:.85rem; font-weight:700}
.q .stem{margin:.2rem 0 .5rem; font-weight:700}
.q .opts{display:grid; gap:.4rem}
.q .opt{font-family:var(--sans); width:100%}
.q .opt.mono{font-family:var(--mono)}
.q .opt.right{border-width:4px; background:#e1f0e3}
.q .opt.right::after{content:"  ✔ 正確答案"; font-weight:900; color:var(--ok); font-family:var(--sans)}
.q .opt.wrong{border-style:dashed; background:#f8e0d6}
.q .opt.wrong::after{content:"  ✘ 你的選擇"; font-weight:900; color:var(--bad); font-family:var(--sans)}
.q .acts{display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.6rem}
.fb{margin-top:.6rem; border-left:8px solid var(--ink); padding:.4rem .7rem; background:var(--paper2)}
.fb.ok{border-left-style:solid} .fb.no{border-left-style:dashed; background:#f8e6de}
.fb .vd{font-weight:900}
.fb.ok .vd{color:var(--ok)} .fb.no .vd{color:var(--bad)}
.fb.ok .vd::before{content:"✔ "} .fb.no .vd::before{content:"✘ "}
.tt{border-collapse:collapse; font-family:var(--mono); font-variant-ligatures:none; margin:.4rem 0; max-width:100%}
.tt-wrap{overflow-x:auto}
.tt th{background:var(--ink); color:var(--yellow); font-family:var(--sans); padding:.25rem .5rem; font-size:.85rem; white-space:nowrap}
.tt td{border:2px solid var(--ink); padding:.15rem .3rem; text-align:center}
.tt td.given{background:var(--paper2)}
.tt input{width:6.2rem; font-family:var(--mono); font-variant-ligatures:none; text-align:center; border:2px solid var(--ink2); padding:.2rem; min-height:38px; font-size:.95rem}
.tt input.wide{width:9rem}
.tt td.cok{background:#e1f0e3} .tt td.cok::after{content:" ✔"; color:var(--ok); font-weight:900}
.tt td.cno{background:#f8e0d6} .tt td.cno::after{content:" ✘"; color:var(--bad); font-weight:900}
.fillcode{background:var(--code); color:var(--codefg); border:3px solid var(--ink); padding:.5rem .7rem; font-family:var(--mono); font-variant-ligatures:none; white-space:pre; overflow-x:auto; line-height:2}
.fillcode input{font-family:var(--mono); font-variant-ligatures:none; background:#fff; color:var(--ink); border:3px solid var(--yellow); width:7.5rem; padding:0 .3rem; font-size:.95rem; min-height:34px}
.fillcode input.cok{border-color:#7fd08a; border-style:solid; background:#e1f0e3}
.fillcode input.cno{border-color:#ff9b80; border-style:dashed; background:#f8e0d6}
.parsons{list-style:none; margin:0; padding:0; border:3px solid var(--ink); background:var(--code)}
.parsons li{display:flex; align-items:center; gap:.3rem; border-bottom:1px solid #2e3134; color:var(--codefg); background:var(--code); touch-action:none}
.parsons li.dragging{opacity:.35}
.parsons li.dropmark{box-shadow:inset 0 4px 0 var(--yellow)}
.parsons .grip{cursor:grab; padding:.3rem .5rem; color:var(--yellow); font-weight:900; user-select:none; -webkit-user-select:none; min-height:44px; display:flex; align-items:center}
.parsons code{flex:1; white-space:pre; overflow-x:auto; padding:.2rem 0}
.parsons .mv{display:flex; gap:2px}
.parsons .mv button{background:#33373b; color:#fff; border:2px solid #5a6066; width:40px; height:40px; cursor:pointer; font-size:.9rem}
.parsons li.pok{box-shadow:inset 6px 0 0 #7fd08a} .parsons li.pok code::after{content:"   ✔"; color:#9fe0a8; font-family:var(--sans)}
.parsons li.pno{box-shadow:inset 6px 0 0 #ff9b80} .parsons li.pno code::after{content:"   ✘ 位置不對"; color:#ffb4a0; font-family:var(--sans)}
.typed{display:flex; gap:.5rem; flex-wrap:wrap; align-items:center}
.typed input{font-family:var(--mono); font-variant-ligatures:none; border:3px solid var(--ink); padding:.3rem .5rem; min-height:44px; width:14rem; max-width:100%}

.report{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; margin-top:1rem}
.manifest{border:3px solid var(--ink); background:#fff; padding:.7rem .9rem; position:relative}
.manifest .big{font-family:var(--stencil); font-weight:900; font-size:2.6rem; line-height:1}
.bar2{height:14px; border:2px solid var(--ink); background:#fff; margin:.4rem 0}
.bar2 i{display:block; height:100%; background:repeating-linear-gradient(-45deg,var(--ink) 0 5px,var(--steel2) 5px 10px)}
.map{width:100%; border-collapse:collapse; font-size:.92rem}
.map th,.map td{border:2px solid var(--ink); padding:.3rem .5rem; vertical-align:top; text-align:left}
.map th{background:var(--ink); color:#fff}
.map-wrap{overflow-x:auto}
details.teacher > summary{cursor:pointer; font-weight:900; padding:.5rem .8rem; background:var(--ink); color:var(--yellow); list-style:none}
details.teacher > summary::before{content:"▶ "} details.teacher[open] > summary::before{content:"▼ "}
footer{max-width:1180px; margin:0 auto; padding:1rem; font-size:.85rem; color:var(--ink2)}

/* ===== 響應式 ===== */
@media (max-width: 1100px){
  .st-grid{grid-template-columns:minmax(0,1fr)}
  .racks{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .racks .rack:nth-child(2){grid-column:1 / -1; grid-row:1}
}
@media (max-width: 820px){
  .report,.ba{grid-template-columns:minmax(0,1fr)}
  .grid2,.labeler,.sq,.scope-row{grid-template-columns:minmax(0,1fr)}
  .racks{grid-template-columns:minmax(0,1fr)}
  .racks .rack:nth-child(2){grid-column:auto; grid-row:auto}
  .viewsw{display:inline-flex}
  .codetab.only-py .pc,.codetab.only-py th.pch{display:none}
  .codetab.only-pc .py,.codetab.only-pc th.pyh{display:none}
  
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important; transition:none!important}
}
body.big{--fs-scale:1.15}
</style>
</head>
<body>
<div class="series" role="banner">
  <span>第 1 章 · 智能物流倉</span>
  <span class="tools">
    <button class="tog" id="sndBtn" aria-pressed="false">🔇 音效：關</button>
    <button class="tog" id="bigBtn" aria-pressed="false">A+ 放大字體</button>
  </span>
</div>

<header class="hero">
  <div class="kicker">SMART WAREHOUSE</div>
  <h1><span class="plate">智能物流倉</span></h1>
  <p>變量是<b>貼上標籤的貨箱</b>，數據類型是<b>貨格</b>，函數是<b>分倉</b>。揀一個倉區，按 <b>下一步 ▶</b> 逐行執行，看貨箱和輸出怎樣變化。每個倉區最後都有練習。</p>
</header>

<nav class="zones" aria-label="倉區">
  <button class="zone" data-go="s11"><b>1.1 良好的程式設計風格</b><small>STYLE BAY</small><span class="badge" data-score="11"></span></button>
  <button class="zone" data-go="s12"><b>1.2 選擇合適的數據類型</b><small>RACK BAY</small><span class="badge" data-score="12"></span></button>
  <button class="zone" data-go="s13"><b>1.3 模組化程式設計</b><small>SUB-WAREHOUSE</small><span class="badge" data-score="13"></span></button>
</nav>

<main>
<\!-- ================= 1.1 ================= -->
<section class="sec" id="s11">
  <div class="sec-banner"><h2>1.1 良好的程式設計風格</h2><p>重構 · 命名 · 註釋 · 縮排與空格</p></div>
  <div class="chips"><button data-jump="c11a">① 重構</button><button data-jump="c11b">② 命名</button><button data-jump="c11c">③ 註釋與 docstring</button><button data-jump="c11d">④ 縮排與空格</button><button data-jump="drill11">🎯 練習</button></div>

  <article class="card" id="c11a">
    <div class="card-tag">① 良好風格與重構</div>
    <div class="book"><ul>
      <li>良好的程式設計風格對於編寫<b>易於閱讀、測試和除錯</b>的程式碼至關重要。</li>
      <li><b>重構</b>旨在改善程式碼的<b>內部結構</b>，同時保持其<b>外部行為不變</b>。</li>
    </ul></div>
    <p class="try">按「整理下一項」，看凌亂的程式逐步變得易讀；同時留意輸出有沒有改變。</p>
    <div class="ctl">
      <button class="btn alt" id="refPrev">◀ 還原一項</button>
      <button class="btn" id="refNext">整理下一項 ▶</button>
      <label class="chk bug"><input type="checkbox" id="refBug"> ✘ 錯誤示範：「順手」把 &gt; 改成 &gt;=</label>
    </div>
    <ul class="steps-list" id="refSteps"></ul>
    <div class="ba">
      <div><h4>整理前</h4><div class="codebox"><pre class="pre" id="refBefore"></pre></div></div>
      <div><h4>整理後</h4><div class="codebox"><pre class="pre" id="refAfter"></pre></div></div>
    </div>
    <div class="ctl" style="margin-top:.8rem">
      <label class="field">測試數據：重量列表 <input class="mono" id="refList" value="12, 5, 30, 10, 8" size="16"></label>
      <label class="field">下限 <input class="mono" id="refLimit" type="number" value="10" min="0" max="99" style="width:5rem"></label>
    </div>
    <div class="result" id="refResult" aria-live="polite"></div>
    <div class="takeaway">重構只改「寫法」，不改「結果」：相同輸入必須得到相同輸出。</div>
  </article>

  <article class="card" id="c11b">
    <div class="card-tag">② 變量命名：snake_case</div>
    <div class="book"><ul><li>變量名稱應採用<b>蛇形命名法 snake_case</b>，並<b>清晰描述其所儲存的值</b>。</li></ul></div>
    <p class="try">替貨箱寫標籤（變量名稱），看看是否合格、Python 會怎樣反應。</p>
    <div class="labeler">
      <div class="ship-label">
        <div class="ctl" style="justify-content:space-between;margin:0"><span>貨箱內容：<b id="lblTask"></b></span><button class="btn alt" id="lblNext">換一箱 ↻</button></div>
        <div class="bar" aria-hidden="true"></div>
        <label for="lblInput" class="hint">標籤（變量名稱）：</label>
        <input id="lblInput" class="mono" autocomplete="off" autocapitalize="off" spellcheck="false" value="totalWeight">
        <div class="hint" style="margin-top:.4rem">試試這些標籤，找出哪一個合格（右邊會逐項檢查）：</div>
        <div class="ctl" id="lblSamples" style="margin:0"></div>
      </div>
      <div>
        <ul class="checks" id="lblChecks"></ul>
        <div class="hint">Python 執行 <code id="lblLine"></code>：</div>
        <div class="pyreact" id="lblReact"></div>
      </div>
    </div>
    <div class="takeaway">全小寫、用底線分隔單詞，名稱要看得出箱內裝甚麼。（全大寫如 TAX_RATE 是常數的寫法。）</div>
  </article>

  <article class="card" id="c11c">
    <div class="card-tag">③ 註釋與 docstring</div>
    <div class="book"><ul><li><b>註釋</b>應闡明程式碼背後的<b>「原因」</b>，而<b>文檔字串 docstring</b> 則用於<b>記錄函數目的</b>。</li></ul></div>
    <div class="grid2">
      <div>
        <p class="try">每一行程式，揀較好的註釋。</p>
        <div id="cmtBox"></div>
      </div>
      <div>
        <p class="try">docstring 放在哪裏？</p>
        <div class="codebox"><pre class="pre" id="docDemo"></pre></div>
        <p class="hint">docstring 是函數內<b>第一行</b>、用三個引號 <code>"""</code> 包圍的字串，說明函數<b>做甚麼</b>；註釋用 <code>#</code> 開始，說明<b>為甚麼</b>。</p>
      </div>
    </div>
    <div class="takeaway">註釋寫「為甚麼」，不要把程式碼再讀一次；docstring 寫函數的目的。</div>
  </article>

  <article class="card" id="c11d">
    <div class="card-tag">④ 縮排與空格</div>
    <div class="book"><ul><li>Python 程式碼需<b>正確使用縮排與空格</b>，以避免錯誤並提升可讀性。</li></ul></div>
    <p class="try">揀 <code>print(total)</code> 的位置，先預測輸出，再逐行執行。</p>
    <div class="ctl">
      <label class="field">分數列表 <input class="mono" id="indList" value="60, 75, 90" size="12"></label>
      <button class="btn alt" data-ind="in" aria-pressed="true">縮排在循環內</button>
      <button class="btn alt" data-ind="out" aria-pressed="false">在循環之後</button>
      <button class="btn alt" data-ind="broken" aria-pressed="false" style="border-style:dashed">✘ 循環體沒有縮排</button>
    </div>
    <div id="indStepper"></div>
    <div class="takeaway">縮排決定一行屬於哪個區塊：同一行放在不同層，結果完全不同；該縮排而沒有縮排，程式根本不能執行。</div>
  </article>

  <div class="drill" id="drill11"></div>
</section>

<\!-- ================= 1.2 ================= -->
<section class="sec" id="s12">
  <div class="sec-banner"><h2>1.2 選擇合適的數據類型</h2><p>簡單 · 結構化 · 用戶定義</p></div>
  <div class="chips"><button data-jump="c12a">① 揀類型</button><button data-jump="c12b">② 選錯的後果</button><button data-jump="c12c">③ 堆疊與隊列</button><button data-jump="c12d">④ 類別</button><button data-jump="drill12">🎯 練習</button></div>

  <article class="card" id="c12a">

<script>
const CONFIG = {
  INDEX_URL: "./",
  STORAGE_KEY: "electiveC-ch1-progress-v1"
};

/* ================= 共用工具 ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function parseIntList(s, max = 12) {
  const out = [];
  String(s).split(/[,，\s]+/).forEach(t => { if (t === '') return; const n = Number(t); if (Number.isInteger(n) && Math.abs(n) <= 9999) out.push(n); });
  return out.slice(0, max);
}
function clampInt(v, lo, hi, d) { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; }

const store = {
  read() { try { return JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY) || '{}') || {}; } catch (e) { return {}; } },
  get(k, d) { const o = this.read(); return (o && k in o) ? o[k] : d; },
  set(k, v) { try { const o = this.read(); o[k] = v; localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(o)); } catch (e) { /* 寫入失敗也照常運作 */ } },
  clear() { try { localStorage.removeItem(CONFIG.STORAGE_KEY); } catch (e) {} }
};

const Sound = {
  on: false, ctx: null,
  beep(f = 600, d = .06, type = 'square', vol = .06) {
    if (!this.on) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .02);
    } catch (e) {}
  },
  step() { this.beep(520, .04); }, ok() { this.beep(880, .14, 'triangle', .09); }, bad() { this.beep(170, .2, 'sawtooth', .05); }
};

/* ================= Python 值的表示（與 Python 3 repr 一致） ================= */
const PY = {
  int: n => String(n),
  float(x) {
    if (Number.isNaN(x)) return 'nan';
    if (!Number.isFinite(x)) return x > 0 ? 'inf' : '-inf';
    if (x === 0) return Object.is(x, -0) ? '-0.0' : '0.0';
    const a = Math.abs(x);
    if (a >= 1e16 || a < 1e-4) {
      let [m, e] = x.toExponential().split('e');
      const sign = e[0] === '-' ? '-' : '+'; let d = e.replace(/^[+-]/, ''); if (d.length < 2) d = '0' + d;
      return m + 'e' + sign + d;
    }
    if (Number.isInteger(x)) return x.toFixed(0) + '.0';
    return String(x);
  },
  str: s => "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'",
  bool: b => b ? 'True' : 'False',
  list: arr => '[' + arr.join(', ') + ']'
};
function noisyFloat(s) { const m = /\.(\d+)/.exec(s); return !!(m && m[1].length >= 10); }

/* ================= 語法顯示 ================= */
const PY_KW = new Set(['def', 'return', 'for', 'in', 'if', 'elif', 'else', 'while', 'class', 'True', 'False', 'None', 'and', 'or', 'not', 'import', 'with', 'as', 'pass', 'global']);
const PY_BI = new Set(['print', 'len', 'int', 'float', 'str', 'range', 'input', 'self', 'append', 'pop', 'sum']);
function hlPy(src) {
  const re = /("""[\s\S]*?"""|"[^"]*"|'[^']*'|#[^\n]*|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]\w*\b)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index)); const t = m[0];
    if (t[0] === '#') out += `<span class="c">${esc(t)}</span>`;
    else if (t[0] === '"' || t[0] === "'") out += `<span class="s">${esc(t)}</span>`;
    else if (/^\d/.test(t)) out += `<span class="n">${esc(t)}</span>`;
    else if (PY_KW.has(t)) out += `<span class="k">${t}</span>`;
    else if (PY_BI.has(t)) out += `<span class="b">${t}</span>`;
    else if (/^[A-Z][A-Z0-9_]+$/.test(t)) out += `<span class="cn">${t}</span>`;
    else out += esc(t);
    last = m.index + t.length;
  }
  return out + esc(src.slice(last));
}
const PC_KW = /\b(FUNCTION|END|RETURN|FOR|EACH|IN|NEXT|IF|THEN|ELSE|OUTPUT|WHILE|DO|TYPE|ENDTYPE|NEW|AND|OR|NOT|TRUE|FALSE)\b/g;
function hlPc(src) {
  const ci = src.indexOf('//');
  const code = ci >= 0 ? src.slice(0, ci) : src, com = ci >= 0 ? src.slice(ci) : '';
  let h = esc(code).replace(PC_KW, '<span class="pk">$1</span>').replace(/←/g, '<span class="arr">←</span>');
  return h + (com ? `<span class="c">${esc(com)}</span>` : '');
}

/* ================= 執行記錄器 ================= */
class Rec {
  constructor(startNote) { this.steps = []; this.v = {}; this.out = []; this.touched = new Set(); this.push(null, startNote || '按「▶ 下一步」開始逐行執行。'); }
  set(k, val) { this.v[k] = val; this.touched.add(k); }
  del(...ks) { ks.forEach(k => delete this.v[k]); }
  print(s) { this.out.push(String(s)); }
  push(line, note, extra = {}) {
    const prev = this.steps[this.steps.length - 1];
    const vars = Object.assign({}, this.v), changed = [];
    for (const k in vars) if (this.touched.has(k) || !prev || prev.vars[k] !== vars[k]) changed.push(k);
    const newOut = prev ? this.out.slice(prev.out.length) : [];
    this.steps.push(Object.assign({ line, vars, out: this.out.slice(), newOut, note, changed: prev ? changed : [] }, extra));
    this.touched = new Set();
  }
}

/* ================= 逐步執行器 ================= */
class Stepper {
  /* prog: { rows(p), cols(p), run(p), predict?(p), explain?(p), varLabel?(k) }  getP: () => params  hooks: { onStep(step, i, steps) } */
  constructor(root, prog, getP, hooks = {}) {
    this.root = root; this.prog = prog; this.getP = getP; this.hooks = hooks; this.timer = null; this.view = 'py';
    root.classList.add('stepper'); if (hooks.noVars) root.classList.add('novars');
    root.innerHTML = `
      <div class="st-pred"></div>
      <div class="st-grid">
        <div>
          <div class="st-codehead"><b>程式碼（Python ｜ 偽代碼）</b>
            <span class="viewsw" role="group" aria-label="切換顯示"><button class="btn alt" data-v="py" aria-pressed="true">Python</button><button class="btn alt" data-v="pc" aria-pressed="false">偽代碼</button></span></div>
          <div class="codebox"><table class="codetab only-py"><thead><tr><th></th><th></th><th class="pyh">Python</th><th class="pch">偽代碼</th></tr></thead><tbody></tbody></table></div>
        </div>
        <div class="st-side">
          <div${hooks.noVars ? ' hidden' : ''}><div class="boxtitle">📦 變量（貨箱）</div><div class="vars"></div></div>
          <div><div class="boxtitle">🖨 輸出</div><div class="console" aria-live="polite"></div></div>
        </div>
      </div>
      <div class="note" aria-live="polite"></div>
      <div class="ctrl">
        <button class="btn alt" data-a="reset" title="重設">⟲ 重設</button>
        <button class="btn alt" data-a="prev" title="上一步">◀ 上一步</button>
        <button class="btn" data-a="next" title="下一步">▶ 下一步</button>
        <button class="btn dark" data-a="play" aria-pressed="false">⏵ 自動播放</button>
        <label>速度 <input type="range" min="1" max="5" value="3" data-a="speed" aria-label="自動播放速度"></label>
        <span class="cnt" aria-live="off"></span>
      </div>
      <div class="hook"></div>
      <details class="trace-box"${hooks.traceOpen ? ' open' : ''}><summary>📋 追蹤表 <span class="hint">（只記下該步改變了的值；▶ 為目前一步）</span></summary>
      <div class="trace-wrap"><table class="trace"></table></div></details>`;
    this.$ = s => root.querySelector(s);
    root.querySelector('.ctrl').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const a = b.dataset.a;
      if (a === 'next') { this.stop(); this.step(1); } else if (a === 'prev') { this.stop(); this.step(-1); }
      else if (a === 'reset') { this.stop(); this.go(0); } else if (a === 'play') { this.timer ? this.stop() : this.play(); }
    });
    root.querySelector('.viewsw').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return; this.view = b.dataset.v;
      $$('.viewsw button', root).forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      const t = this.$('.codetab'); t.classList.toggle('only-py', this.view === 'py'); t.classList.toggle('only-pc', this.view === 'pc');
    });
    this.rebuild();
  }
  rebuild() {
    this.stop();
    this.p = this.getP();
    this.rows = this.prog.rows(this.p).filter(Boolean);
    this.cols = this.prog.cols(this.p);
    this.steps = this.prog.run(this.p);
    this.pred = this.prog.predict ? this.prog.predict(this.p) : null;
    this.choice = null; this.skipPred = false;
    // Python 行號
    let n = 0; this.lineNo = {};
    this.rows.forEach(r => { if (r.py !== '' || r.blank) { n++; this.lineNo[r.id] = n; } });
    const tb = this.$('.codetab tbody');
    tb.innerHTML = this.rows.map(r => `<tr data-id="${r.id}"><td class="gut"></td><td class="ln">${this.lineNo[r.id] || ''}</td><td class="py">${hlPy(r.py)}</td><td class="pc">${hlPc(r.pc || '')}</td></tr>`).join('');
    // 追蹤表
    const th = `<thead><tr><th>步</th><th>行</th>${this.cols.map(c => `<th>${esc(c)}</th>`).join('')}<th>輸出</th></tr></thead>`;
    const body = this.steps.slice(1).map((s, i) => `<tr class="fut"><td>${i + 1}</td><td>${this.lineNo[s.line] || '–'}</td>${this.cols.map(c => {
      const v = s.changed.includes(c) && c in s.vars ? s.vars[c] : ''; return `<td>${esc(v)}</td>`; }).join('')}<td class="${s.err ? 'er' : ''}">${esc(s.newOut.join(' ⏎ '))}</td></tr>`).join('');
    this.$('.trace').innerHTML = th + '<tbody>' + body + '</tbody>';
    this.renderPred();
    this.go(0);
  }
  renderPred() {
    const box = this.$('.st-pred');
    if (!this.pred) { box.innerHTML = ''; return; }
    box.innerHTML = `<div class="predict"><div class="q">${this.pred.q}</div><div class="opts">${this.pred.options.map((o, i) => `<button class="opt" data-i="${i}" aria-pressed="false">${esc(o.t)}</button>`).join('')}</div><div class="verdict" aria-live="polite"></div></div>`;
    box.querySelector('.opts').addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b) return;
      this.choice = +b.dataset.i;

  const box = $(id); const d = el('div', err ? 'er' : '', `<span class="pr">${err ? '✘' : '&gt;'}</span> ${esc(line)}${res ? '   # ' + esc(res) : ''}`);
  box.appendChild(d); box.scrollTop = box.scrollHeight;
}
function renderSQ() {
  $('#stViz').innerHTML = SQ.stack.length ? SQ.stack.map((v, i) => `<div class="pallet${i === SQ.stack.length - 1 ? ' top' : ''}">揀貨 ${v}</div>`).join('') : '<span class="hint">（空堆疊）</span>';
  $('#quViz').innerHTML = SQ.queue.length ? SQ.queue.map((v, i) => `<div class="truck"><span class="pos">${i === 0 ? '▶ 隊頭（先卸）' : i === SQ.queue.length - 1 ? '隊尾' : '第 ' + (i + 1) + ' 位'}</span>🚚 ${esc(v)}</div>`).join('') : '<span class="hint">（月台空置）</span>';
}
function initSQ() {
  renderSQ();
  $('#stPush').addEventListener('click', () => {
    if (SQ.stack.length >= 8) { sqLog('#stLog', '（示範只容納 8 個記錄）'); return; }
    const v = LETTERS[SQ.next++ % 26]; SQ.stack.push(v); sqLog('#stLog', `undo_stack.append("${v}")`, 'undo_stack = ' + PY.list(SQ.stack.map(PY.str))); Sound.step(); renderSQ();
  });
  $('#stPop').addEventListener('click', () => {
    if (!SQ.stack.length) { sqLog('#stLog', 'undo_stack.pop()', '', true); sqLog('#stLog', 'IndexError: pop from empty list  ← 沒有操作可撤銷', '', true); Sound.bad(); return; }
    const v = SQ.stack.pop(); sqLog('#stLog', 'undo_stack.pop()', `取出 '${v}'（最後放入的最先取出）`); Sound.step(); renderSQ();
  });
  $('#stReset').addEventListener('click', () => { SQ.stack = []; SQ.next = 0; $('#stLog').innerHTML = ''; renderSQ(); });
  $('#quPush').addEventListener('click', () => {
    if (SQ.queue.length >= 6) { sqLog('#quLog', '（示範月台只容納 6 架貨車）'); return; }
    const v = '貨車' + (++SQ.truck); SQ.queue.push(v); sqLog('#quLog', `waiting.append("${v}")`, '加到隊尾'); Sound.step(); renderSQ();
  });
  $('#quPop').addEventListener('click', () => {
    if (!SQ.queue.length) { sqLog('#quLog', 'waiting.pop(0)', '', true); sqLog('#quLog', 'IndexError: pop from empty list  ← 沒有貨車在等候', '', true); Sound.bad(); return; }
    const v = SQ.queue.shift(); sqLog('#quLog', 'waiting.pop(0)', `取出 '${v}'（最先到的最先卸貨）`); Sound.step(); renderSQ();
  });
  $('#quReset').addEventListener('click', () => { SQ.queue = []; SQ.truck = 0; $('#quLog').innerHTML = ''; renderSQ(); });
}

const PROG_RECT = {

      { id: 'C3', py: '        self.width = width', pc: '  self.width ← width' },
      { id: 'C4', py: '        self.height = height', pc: '  self.height ← height' },
      { id: 'C5', py: '    def area(self):', pc: '  FUNCTION area()' },

      { id: 'CE', py: '', pc: 'ENDTYPE' },

  run(p) {

    const make = (name, w, h, line) => {
      r.push(line, `呼叫 Rectangle(${w}, ${h})，建立一個新物件。`);
      r.set('width', String(w)); r.set('height', String(h)); r.push('C2', `__init__ 收到 width = ${w}、height = ${h}（self 代表正在建立的物件）。`);
      r.set('self.width', String(w)); r.push('C3', `把闊存入物件：self.width = ${w}。`);
      r.set('self.height', String(h)); r.push('C4', `把高存入物件：self.height = ${h}。`);
      r.del('width', 'height', 'self.width', 'self.height');
      r.set(name, `Rectangle(width=${w}, height=${h})`); r.push(line, `${name} 成為一個 Rectangle 物件，內有自己的 width 和 height。`);
    };
    make('box_a', p.w1, p.h1, 'C7'); make('box_b', p.w2, p.h2, 'C8');
    const area = (name, w, h, k) => {
      r.push('C9', `${k}計算 ${name}.area()。`);
      r.set('self.width', String(w)); r.set('self.height', String(h)); r.push('C5', `執行 area 方法，此時 self 就是 ${name}。`);
      r.set('傳回值', String(w * h)); r.push('C6', `self.width * self.height = ${w} * ${h} = ${w * h}，傳回 ${w * h}。`);
      r.del('self.width', 'self.height', '傳回值');
    };
    area('box_a', p.w1, p.h1, '先'); area('box_b', p.w2, p.h2, '再');
    const a1 = p.w1 * p.h1, a2 = p.w2 * p.h2;
    r.print(String(a1 + a2)); r.push('C9', `${a1} + ${a2} = ${a1 + a2}，輸出 ${a1 + a2}。`);

      { t: String(p.w1 + p.h1 + p.w2 + p.h2), ok: false, why: '這是把四個數加起來；area() 是把闊和高相乘。' },
      { t: String(p.w1 * p.h1 * p.w2 * p.h2), ok: false, why: '這是把兩個面積相乘；程式中兩個 area() 之間是 +。' },

    return { q: '這個程式會輸出甚麼？', options: opts };
  }
};

/* ================= 1.3 工作台 J：分倉與總倉公告板 ================= */
const SC_KIND = { TAX_RATE: 'g', calc_total: 'g', order_1: 'g', order_2: 'g', price: 'p', qty: 'p', subtotal: 'l', tax: 'l' };
const SC_LAB = { g: '全程', p: '參數', l: '局部' };

}
function scCalc(p, q) { const s = p * q, t = s * 0.1, r = s + t; return { s, t, r, tr: PY.float(t), rr: PY.float(r) }; }
const PROG_SCOPE = {

      { id: 'S7', py: `order_1 = calc_total(${p.p1}, ${p.q1})`, pc: `order_1 ← calc_total(${p.p1}, ${p.q1})` },

  cols() { return ['TAX_RATE', 'price', 'qty', 'subtotal', 'tax', 'order_1', 'order_2']; },

  predict(p) {

const QSTATE = { results: store.get('results', {}), best: store.get('best', {}) };
const norm = s => String(s == null ? '' : s).replace(/\s+/g, '').replace(/"/g, "'");
const normB = s => { const n = norm(s); return /^(true|false)$/i.test(n) ? n[0].toUpperCase() + n.slice(1).toLowerCase() : n; };
function shuffleNot(arr, seed) {
  const a = arr.slice(); let s = seed;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let k = 0; k < 20; k++) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } if (a.some((x, i) => x !== arr[i])) break; }
  return a;
}
function record(q, ok) {
  if (!(q.id in QSTATE.results)) { QSTATE.results[q.id] = ok; store.set('results', QSTATE.results); }
  const sec = q.sec, score = secScore(sec);
  if (score > (QSTATE.best[sec] || 0)) { QSTATE.best[sec] = score; store.set('best', QSTATE.best); }
  ok ? Sound.ok() : Sound.bad();
  updateScores();
}
const secQs = sec => QUESTIONS.filter(q => q.sec === sec);
const secScore = sec => secQs(sec).filter(q => QSTATE.results[q.id] === true).length;
function updateScores() {
  SECTIONS.forEach(S => {
    const n = secQs(S.id).length, done = secQs(S.id).filter(q => q.id in QSTATE.results).length;
    const box = $(`#drill${S.id} .score`);
    const bd = document.querySelector(`.badge[data-score="${S.id}"]`); if (bd) bd.textContent = `★ ${secScore(S.id)}/${n}`;
    if (box) box.innerHTML = `<span>本節得分 ${secScore(S.id)} / ${n}</span><span>已作答 ${done} / ${n}</span><span>最佳紀錄 ${QSTATE.best[S.id] || 0} / ${n}</span>`;
  });
  renderReport();
}
function fbHTML(ok, html) { return `<div class="fb ${ok ? 'ok' : 'no'}"><div class="vd">${ok ? '正確！' : '未正確。'}</div>${html}</div>`; }
function codeBlock(c) { return `<div class="codebox" style="margin:.3rem 0 .6rem"><pre class="pre">${hlPy(c)}</pre></div>`; }

function renderQuestion(q, num) {
  const card = el('div', 'q'); card.id = 'card-' + q.id;
  const prev = q.id in QSTATE.results ? `（首次作答：${QSTATE.results[q.id] ? '✔ 答對' : '✘ 答錯'}）` : '';

    body.addEventListener('click', e => { const b = e.target.closest('.opt'); if (!b || submit.disabled) return; pick = +b.dataset.i; $$('.opt', body).forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); });
    submit.addEventListener('click', () => {
      if (pick == null) { fbx.innerHTML = '<div class="fb no"><div class="vd">請先揀選一個答案。</div></div>'; return; }
      const o = q.options[pick], ci = q.options.findIndex(x => x.ok);
      $$('.opt', body).forEach((b, i) => { if (i === ci) b.classList.add('right'); else if (i === pick) b.classList.add('wrong'); });
      finish(!!o.ok, o.ok ? `<p>${esc(o.why)}</p>` : `<p><b>你選了 ${String.fromCharCode(65 + pick)}：</b>${esc(o.why)}</p><p><b>正確答案 ${String.fromCharCode(65 + ci)}：</b>${esc(q.options[ci].why)}</p>`);
    });
  }

  if (q.type === 'trace') {
    let h = `<div class="tt-wrap"><table class="tt"><thead><tr><th>#</th>${q.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>`;
    q.rows.forEach((r, ri) => {
      h += `<tr><td>${ri + 1}</td>${r.c.map((c, ci) => c.a ? `<td><input class="${q.wide ? 'wide' : ''}" data-r="${ri}" data-c="${ci}" aria-label="第 ${ri + 1} 行 ${esc(q.cols[ci])}" autocomplete="off" autocapitalize="off" spellcheck="false"></td>` : `<td class="given">${esc(c.g)}</td>`).join('')}</tr>`;
    });
    h += `</tbody></table></div><label class="typed" style="margin-top:.4rem"><b>輸出：</b><input data-out="1" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="輸出"></label>`;
    body.innerHTML = h;
    submit.addEventListener('click', () => {
      let allOk = true; const notes = [];
      q.rows.forEach((r, ri) => r.c.forEach((c, ci) => {
        if (!c.a) return; const inp = body.querySelector(`input[data-r="${ri}"][data-c="${ci}"]`);
        const ok = c.a.map(normB).includes(normB(inp.value)); inp.parentElement.classList.toggle('cok', ok); inp.parentElement.classList.toggle('cno', !ok);
        if (!ok) { allOk = false; notes.push(`第 ${ri + 1} 行「${q.cols[ci]}」應為 <code>${esc(c.a[0])}</code>${inp.value.trim() ? `（你寫了 <code>${esc(inp.value.trim())}</code>）` : '（未填）'}：${esc(r.why)}`); }
      }));
      const oi = body.querySelector('[data-out]'); const ook = q.output.a.map(norm).includes(norm(oi.value));
      oi.style.borderStyle = ook ? 'solid' : 'dashed'; oi.style.background = ook ? '#e1f0e3' : '#f8e0d6';

      $$('input', body).forEach(i => i.readOnly = true);
      finish(allOk, allOk ? `<p>追蹤表全部正確。${esc(q.output.why)}</p>` : `<ul>${notes.map(n => `<li>${n}</li>`).join('')}</ul>`);

      });

  }

    let pick = null;
    body.innerHTML = `<ul class="linepick">${q.lines.map((l, i) => `<li><button data-i="${i}" aria-pressed="false"><span class="ln">${i + 1}</span><span class="flag"></span><code>${hlPy(l.c)}</code></button></li>`).join('')}</ul>`;
    body.addEventListener('click', e => { const b = e.target.closest('button'); if (!b || submit.disabled) return; pick = +b.dataset.i; $$('li', body).forEach((li, i) => li.classList.toggle('sel', i === pick)); });
    submit.addEventListener('click', () => {

      finish(ok, ok ? `<p>第 ${ci + 1} 行：${esc(q.lines[ci].why)}</p>` : `<p><b>你選了第 ${pick + 1} 行：</b>${esc(q.lines[pick].why)}</p><p><b>出錯的是第 ${ci + 1} 行：</b>${esc(q.lines[ci].why)}</p>`);

  $('#bigBtn').addEventListener('click', e => { const on = document.body.classList.toggle('big'); e.currentTarget.setAttribute('aria-pressed', on); store.set('big', on); });
  safe(initRefactor, 'refactor'); safe(initLabeler, 'labeler'); safe(initComments, 'comments'); safe(initIndent, 'indent');
  safe(initCargo, 'cargo'); safe(initTypes, 'types'); safe(initSQ, 'sq'); safe(initRect, 'rect');
  safe(initMod, 'mod'); safe(initScope, 'scope');
  safe(() => SECTIONS.forEach(S => renderDrill(S.id)), 'drills');
  safe(updateScores, 'scores'); safe(renderMapping, 'mapping');
  $('#clearAll').addEventListener('click', () => { store.clear(); QSTATE.results = {}; QSTATE.best = {}; SECTIONS.forEach(S => renderDrill(S.id)); updateScores(); });
  // 倉區切換（一次只顯示一節）
  const show = (id, scroll) => {
    if (!['s11', 's12', 's13'].includes(id)) id = 's11';
    $$('.sec').forEach(x => x.classList.toggle('on', x.id === id));
    $$('.zone').forEach(z => z.setAttribute('aria-current', z.dataset.go === id ? 'true' : 'false'));
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
    if (scroll) window.scrollTo({ top: $('.zones').offsetTop, behavior: REDUCED ? 'auto' : 'smooth' });
  };
  $$('.zone').forEach(z => z.addEventListener('click', () => show(z.dataset.go, true)));
  $$('.chips [data-jump]').forEach(c => c.addEventListener('click', () => { const t = document.getElementById(c.dataset.jump); if (t) t.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); }));
  document.addEventListener('click', e => { const a = e.target.closest('a[href^="#s1"]'); if (a) { e.preventDefault(); show(a.getAttribute('href').slice(1), true); } });
  show((location.hash || '#s11').slice(1).split('-')[0], false);
});

<!DOCTYPE html>

<style>
:root{

}

html{font-size:clamp(15px, .55vw + 10px, 21px)}

  margin:0; color:var(--ink); font-family:var(--sans); line-height:1.6; overflow-x:clip;

}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--amber); outline-offset:2px}
.dim{color:var(--dim)}
code,.mono{font-family:var(--mono)}
code,.mono,.code,.sboard,.console,.crate,.tok,.opt,.tin,pre,input,svg text,.dig,.pill,.olines,.stall .tag,.stall .v,.big{font-variant-ligatures:none; font-feature-settings:"liga" 0, "calt" 0}
.box{scroll-margin-top:6.5rem}

/* ---------- 招牌 ---------- */
header.hero{position:relative; padding:2.2rem 1rem 1rem; text-align:center}
.lights{position:absolute; left:0; right:0; top:0; height:30px; pointer-events:none;
  background:
   radial-gradient(circle at 50% 70%, #ffe1a1 0 3px, rgba(255,210,122,.45) 4px, transparent 9px) 0 0/44px 30px repeat-x,

  text-shadow:0 0 3px #fff, 0 0 10px var(--pink), 0 0 26px var(--pink), 0 0 52px rgba(255,79,163,.7)}
.flick{animation:flick 7s infinite}
@keyframes flick{0%,18%,20%,22%,61%,63%,100%{opacity:1} 19%,21%,62%{opacity:.35}}
.hero .sub{margin:.8rem 0 0; color:var(--amber); font-weight:700; letter-spacing:.06em;

/* ---------- 街牌導航 ---------- */
nav.streets{position:sticky; top:0; z-index:20; display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap;

.sign .badge{position:absolute; top:-.6rem; right:-.5rem; background:#111; color:var(--amber); border:2px solid var(--amber);

/* ---------- 街 / 區 ---------- */
main{max-width:1500px; margin:0 auto; padding:1rem clamp(.6rem, 2vw, 2rem) 3rem}
.street{display:none}

.street-banner h2{display:inline-block; margin:0; padding:.2rem 1.2rem; font-size:clamp(1.6rem, 3.6vw, 2.6rem); font-weight:900;

.chips{display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center; margin:.8rem 0 1.4rem}
.chips button{background:transparent; color:var(--ink); border:2px dashed var(--line); border-radius:999px; padding:.25rem .9rem; cursor:pointer}
.chips button:hover{border-color:var(--c); border-style:solid}

/* ---------- 燈箱 ---------- */
.box{--c:var(--pink); position:relative; margin:2.2rem 0; padding:1.8rem clamp(.7rem,1.6vw,1.5rem) 1.3rem;
  background:linear-gradient(180deg, var(--panel2), var(--panel)); border:2px solid var(--c); border-radius:8px;
  box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 0 26px -8px var(--c)}
.box-tag{position:absolute; top:-1.05rem; left:1rem; background:var(--c); color:#130d19; font-weight:900; font-size:1.1rem;
  padding:.15rem 1.1rem .15rem .9rem; clip-path:polygon(0 0, 100% 0, calc(100% - .6rem) 100%, 0 100%); letter-spacing:.04em}
.keypts{margin:0 0 1rem; padding:.7rem 1rem; border-left:4px solid var(--c); background:rgba(255,255,255,.035); border-radius:0 6px 6px 0}
.keypts ul{margin:.2rem 0; padding-left:1.3rem}
.keypts li{margin:.15rem 0}
.keypts b{color:#fff}
.controls{display:flex; flex-wrap:wrap; gap:.8rem 1.4rem; align-items:center; margin:0 0 1rem; padding:.7rem 1rem;
  background:rgba(0,0,0,.28); border:1px dashed var(--line); border-radius:6px}
.controls label{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap}
.controls input[type=number],.controls input[type=text],.controls select{background:#0b0910; color:var(--ink); border:2px solid var(--line);
  border-radius:5px; padding:.25rem .5rem; font-family:var(--mono)}
.controls input[type=number]{width:5.2rem}
.controls input[type=range]{accent-color:var(--c); width:min(14rem, 45vw)}
.pill{font-family:var(--mono); background:#0b0910; border:1px solid var(--line); padding:.05rem .5rem; border-radius:4px}

/* switch */
.sw{display:inline-flex; align-items:center; gap:.5rem; cursor:pointer}
.sw input{position:absolute; opacity:0; width:1px; height:1px}
.sw .track{width:3.2rem; height:1.7rem; border-radius:999px; background:#2a2236; border:2px solid var(--line); position:relative; transition:.2s}

.sw input:checked + .track{background:color-mix(in srgb, var(--c) 35%, #2a2236); border-color:var(--c)}

.sw input:focus-visible + .track{outline:3px solid var(--amber)}

/* ---------- 按鈕 ---------- */
.btn{background:#241c30; color:var(--ink); border:2px solid #4b3d60; padding:.4rem .9rem; border-radius:6px; cursor:pointer; font-weight:700}
.btn:hover:not(:disabled){border-color:var(--c)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.primary{background:var(--c); color:#100b16; border-color:var(--c)}

/* ---------- 逐步追蹤器 ---------- */
.tracer{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:1rem; align-items:start}
.tracer > *{min-width:0}
.tracer .note,.tracer .extra.full,.tracer .ctrl{grid-column:1 / -1}
.board{position:relative; background:#09070d; border:2px solid var(--amber); border-radius:6px; padding:1.3rem 0 .6rem;
  box-shadow:0 0 18px -6px var(--amber), inset 0 0 30px rgba(255,182,61,.06)}
.board-tag{position:absolute; top:-.85rem; left:.8rem; background:#09070d; color:var(--amber); border:2px solid var(--amber);
  padding:0 .6rem; font-size:.8rem; font-weight:700; border-radius:4px}
.code{overflow-x:auto; font-family:var(--mono); font-size:1rem}
.ln{display:flex; align-items:baseline; white-space:pre; padding:.12rem .8rem .12rem 0; border-left:5px solid transparent; min-width:max-content}
.ln .no{color:#5f556e; width:2.6em; text-align:right; padding-right:.4em; user-select:none; flex:none}
.ln .mk{width:1.3em; flex:none; color:var(--amber); font-weight:700}
.ln.cur{background:rgba(255,182,61,.17); border-left-color:var(--amber)}
.ln.cur .mk::before{content:"▶"}
.ln.cur code{font-weight:700; text-decoration:underline; text-decoration-color:rgba(255,182,61,.6); text-underline-offset:4px}
.ln code{font-family:inherit}
.c-kw{color:#ff7fc0; font-weight:700} .c-fn{color:#6ff0ff} .c-str{color:#ffd896} .c-num{color:#a9ff92} .c-com{color:#7bd88f; font-style:italic}
.side{display:flex; flex-direction:column; gap:.4rem}
.mini-tag{font-size:.8rem; color:var(--dim); font-weight:700; letter-spacing:.05em}
.crates{display:flex; flex-wrap:wrap; gap:.6rem; margin-bottom:.4rem}
.crate{min-width:5.6rem; max-width:100%; border:2px solid #9a7440; border-radius:4px; padding:.15rem .5rem .3rem; text-align:center;
  background:repeating-linear-gradient(0deg, #3d2c18 0 11px, #31230f 11px 13px)}
.crate .vn{font-family:var(--mono); font-size:.78rem; color:#f1d3a2; border-bottom:1px dashed #9a7440}
.crate .val{font-family:var(--mono); font-size:1.25rem; font-weight:700; color:#fff; overflow-wrap:anywhere}
.crate.empty .val{color:#9c8a74}
.crate.bump{animation:bump .55s}
@keyframes bump{0%{transform:scale(1)} 35%{transform:scale(1.15); box-shadow:0 0 0 3px var(--cyan), 0 0 22px var(--cyan)} 100%{transform:scale(1)}}
.console{background:#040306; border:1px solid #2d2538; border-radius:4px; padding:.4rem .7rem; font-family:var(--mono); color:var(--lime);
  min-height:3rem; max-height:13rem; overflow:auto; font-size:.95rem}
.console .dim{color:#5f6b5c}
.note{background:rgba(255,79,163,.08); border-left:5px solid var(--pink); padding:.6rem .9rem; border-radius:0 6px 6px 0; min-height:2.8rem}

.ctrl{display:flex; flex-wrap:wrap; gap:.5rem; align-items:center}
.ctrl .spd{display:flex; align-items:center; gap:.4rem; color:var(--dim); font-size:.9rem}

.ctrl .prog{margin-left:auto; font-family:var(--mono); color:var(--dim); font-size:.9rem}
.chip-fly{position:fixed; z-index:99; pointer-events:none; font-family:var(--mono); font-weight:700; font-size:1.25rem; color:#120c18;
  background:var(--cyan); padding:0 .5rem; border-radius:4px; box-shadow:0 0 16px var(--cyan)}

/* ---------- 流程圖 ---------- */
.flowwrap{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1rem; align-items:start}
.flowwrap > *{min-width:0}
svg.flow{width:100%; max-width:430px; display:block; margin:auto}
.flow .n{fill:#140f1b; stroke:#6b5d80; stroke-width:2; stroke-dasharray:6 4}
.flow .n.on{fill:rgba(62,232,255,.12); stroke:var(--cyan); stroke-width:3; stroke-dasharray:none}

table.t tr.hi td:first-child::before{content:"▶ "; color:var(--cyan)}
.twrap{overflow-x:auto}

/* ---------- range 帶 ---------- */
.rstrip{display:flex; flex-wrap:wrap; gap:.4rem; margin:.3rem 0}

.stat{display:flex; gap:.8rem; flex-wrap:wrap; margin:.4rem 0}
.stat span{background:#0b0910; border:1px solid var(--line); border-radius:5px; padding:.2rem .7rem}
.stat b{font-family:var(--mono); color:var(--amber)}

/* ---------- 攤位網格 ---------- */
.sgrid{display:grid; grid-template-columns:auto repeat(var(--cols), minmax(0,1fr)); gap:6px; align-items:stretch}
.sgrid .clab,.sgrid .rlab{font-size:.72rem; font-weight:900; color:#111; background:#f6f3ea; border-radius:3px;
  box-shadow:inset 0 0 0 2px #f6f3ea, inset 0 0 0 3px #111; display:grid; place-items:center; padding:.15rem .35rem; white-space:nowrap}
.sgrid .corner{font-size:.7rem; color:var(--dim); display:grid; place-items:center}
.stall{position:relative; min-height:3.4rem; background:#1a1424; border:2px solid #3e3250; border-radius:4px; padding:.9rem .2rem .25rem;
  text-align:center; display:flex; flex-direction:column; justify-content:center; font-size:.9rem; overflow:hidden; user-select:none}
.stall::before{content:""; position:absolute; left:0; right:0; top:0; height:.6rem;
  background:repeating-linear-gradient(90deg, #c23a6e 0 10px, #f3e7ee 10px 20px); opacity:.75}
.stall .v{font-family:var(--mono); font-weight:700; font-size:1.15rem}
.stall .tag{font-size:.68rem; color:var(--dim); font-family:var(--mono)}
.stall.click{cursor:pointer}
.stall.click:hover{border-color:var(--c)}
.stall.lit{border-color:#6c9d64; background:#18221a}
.stall.cur{border-color:var(--cyan); border-width:3px; box-shadow:0 0 16px var(--cyan); background:rgba(62,232,255,.16)}
.stall.cur::after{content:"▶"; position:absolute; left:.2rem; bottom:.05rem; color:var(--cyan); font-size:.75rem}
.stall.good{border-color:var(--lime); background:rgba(147,255,126,.1)}
.stall.bad{border-color:var(--red); border-style:dashed; animation:shake .4s}
.stall.booked{background:#2b1220}
@keyframes shake{25%{transform:translateX(-4px)} 75%{transform:translateX(4px)}}
.odo{display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:.6rem}
.odo .d{display:flex; align-items:center; gap:.5rem}
.odo .lab{font-family:var(--mono); color:var(--dim)}
.odo .dig{font-family:var(--mono); font-size:1.8rem; font-weight:700; width:2.4ch; text-align:center; background:#050407; color:var(--amber);
  border:2px solid #4a3c5e; border-radius:5px; overflow:hidden; text-shadow:0 0 8px rgba(255,182,61,.7)}
.odo .dig.roll{animation:roll .35s}
@keyframes roll{0%{transform:translateY(-60%); opacity:0} 100%{transform:none; opacity:1}}
.two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1rem; align-items:start}
.two > *{min-width:0}
.info{background:#0b0910; border:2px solid var(--line); border-radius:6px; padding:.7rem .9rem; min-height:6rem}
.info .big{font-family:var(--mono); font-size:1.3rem; font-weight:700; color:var(--cyan)}
.tok{font:inherit; font-family:var(--mono); color:#ffd896; background:transparent; border:1px solid transparent; border-radius:3px; padding:0 .1rem; cursor:pointer}
.tok:hover{border-color:var(--cyan)}
.tok.on{background:rgba(62,232,255,.25); border-color:var(--cyan); font-weight:700}
.ln.rowon{background:rgba(62,232,255,.09); border-left-color:var(--cyan)}
.legend{font-size:.85rem; color:var(--dim); margin:.4rem 0}

/* ---------- 分類遊戲 ---------- */
.cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(15rem,1fr)); gap:.8rem}
.gcard{background:#140f1b; border:2px solid var(--line); border-radius:6px; padding:.7rem}

.gcard .row{display:flex; gap:.5rem}
.gcard.ok{border-color:var(--lime)} .gcard.bad{border-color:var(--red); border-style:dashed}
.gcard .why{font-size:.85rem; margin-top:.4rem}

/* ---------- 溢出 ---------- */
.meter{position:relative; height:2.2rem; margin:1.4rem .5rem .4rem; border:2px solid var(--line); border-radius:4px;
  background:linear-gradient(90deg, rgba(62,232,255,.12), rgba(255,79,163,.12))}
.meter .z{position:absolute; top:-1.3rem; font-family:var(--mono); font-size:.75rem; color:var(--dim); transform:translateX(-50%)}
.meter .pin{position:absolute; top:-.3rem; bottom:-.3rem; width:4px; background:var(--amber); transform:translateX(-50%); box-shadow:0 0 10px var(--amber); transition:left .4s}
.meter.over{border-color:var(--red); border-style:dashed}
.meter.over .pin{background:var(--red); box-shadow:0 0 14px var(--red)}
.olines{font-family:var(--mono); display:grid; gap:.3rem}
.olines div{padding:.3rem .6rem; border:1px solid var(--line); border-radius:4px; background:#0b0910; overflow-wrap:anywhere}
.olines .bad{border:2px dashed var(--red); color:#ffc2c2}
.olines .bad::after{content:"  ✘ 算術溢出"; color:var(--red); font-weight:700}
.olines .ok::after{content:"  ✓"; color:var(--lime)}
.olines .skip{opacity:.4}

/* ---------- 練習區 ---------- */

<section class="street" id="s3" style="--c:var(--amber)">

  </div>

  <article class="box" id="s3-count" style="--c:var(--amber)">
    <div class="box-tag">① 計數 與 累加（求和）</div>
    <div class="keypts"><ul>
      <li><b>計數</b>：滿足特定條件發生的次數。將計數器初始化為 0；在循環內部，當滿足條件時加上一個<b>常數值</b>（通常是 1）。</li>
      <li><b>累加</b>：計算<b>運行總和</b>。將總數初始化為 0；在循環內部，加上<b>實際數據值</b>（例如價格、分數）。</li>
    </ul></div>
    <div class="controls">
      <label>data = [ <input type="text" id="cData" value="10, 55, 60, 20" style="width:min(16rem,60vw)"> ]</label>
      <button class="btn" id="cGo">套用到兩邊</button>

    </div>
    <div class="cmp">
      <div><h4>🔢 計數</h4><code>count = count + 1</code><br><span class="dim">條件成立才加，每次加<b>常數 1</b></span></div>
      <div><h4>➕ 累加</h4><code>total = total + item</code><br><span class="dim">每次都加，加的是<b>實際數據值</b></span></div>
    </div>
    <h3>計數：計算 &gt; 50 的項目</h3>
    <div id="trCount"></div>
    <h3 style="margin-top:2rem">累加：計算所有項目的總和</h3>
    <div id="trSum"></div>

      <li>在兩個變量（例如 A 和 B）之間交換值。</li>
      <li><b>暫存變量方法</b>：防止數據丟失的標準、安全方法。</li>
      <li><b>數學方法</b>：使用加法和減法進行交換而不需要第三個變量，但有<b>算術溢出</b>的風險。</li>
    </ul></div>
    <div class="controls">
      <label>A = <input type="number" id="swA" value="3"></label>
      <label>B = <input type="number" id="swB" value="8"></label>

      <label>y = <input type="number" id="mxY" value="2"></label>
      <button class="btn" id="mxGo">套用</button>
    </div>
    <div id="trMath"></div>
  </article>

  <article class="box" id="s3-over" style="--c:var(--amber)">
    <div class="box-tag">③ 數學方法的風險：算術溢出</div>
    <p>假設變量只可儲存 <b>8 位元有符號整數</b>（−128 至 127）。用數學方法交換時，第一步 <code>x = x + y</code> 的結果可能超出範圍，於是發生<b>算術溢出</b>。</p>
    <div class="controls">
      <label>x = <input type="number" id="ovX" value="100" min="-128" max="127"></label>
      <label>y = <input type="number" id="ovY" value="50" min="-128" max="127"></label>
      <button class="btn" id="ovGo">執行數學交換</button>
      <button class="btn" data-ov="100,50">例子：100, 50</button>
      <button class="btn" data-ov="20,30">例子：20, 30</button>
    </div>
    <div class="meter" id="ovMeter"><span class="z" style="left:0">−128</span><span class="z" style="left:50.2%">0</span><span class="z" style="left:100%">127</span><div class="pin" id="ovPin" style="left:50%"></div></div>
    <div class="olines" id="ovLines"></div>
    <p class="dim" style="margin-top:.8rem">註：Python 的整數沒有大小上限，所以在 Python 中不會溢出；但很多程式語言或系統的變量大小是固定的。暫存變量方法完全沒有這個風險。</p>
  </article>

    <div class="box-tag">🎯 練習攤 · 2.3</div>
    <div id="p3"></div>
  </article>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TF=b=>b?'True':'False';
function fmt(v){ if(v===undefined) return '—'; if(v===true) return 'True'; if(v===false) return 'False';
  if(typeof v==='string') return '"'+v+'"'; if(Array.isArray(v)) return '['+v.map(fmt).join(', ')+']'; return String(v); }
function int(el,min,max,def){ let v=parseInt(el.value,10); if(isNaN(v)) v=def; v=Math.max(min,Math.min(max,v)); el.value=v; return v; }
function el(tag,cls,html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }

/* ---------- Python 語法高亮 ---------- */
function hl(line){
  const re=/(#.*$)|(f?"[^"]*")|\b(for|in|if|elif|else|while|True|False|and|or|not)\b|\b(print|range|int|input|len)\b|(\b\d+\b)/g;
  let out='',last=0,m;
  while((m=re.exec(line))){
    out+=esc(line.slice(last,m.index));

/* ---------- 步驟紀錄器 ---------- */
function Rec(){
  const S=[],V={},O=[];
  return {S,V,O,
    rec(line,note,extra){ S.push(Object.assign({line,vars:Object.assign({},V),out:O.slice(),note},extra||{})); },
    end(note,extra){ S.push(Object.assign({line:-1,vars:Object.assign({},V),out:O.slice(),note:note||'✔ 程式執行完畢。',end:true},extra||{})); }
  };
}

/* ---------- 逐步追蹤器 ---------- */
function makeTracer(o){
  const R=o.mount; R.classList.add('tracer');
  R.innerHTML=
   '<div class="board"><div class="board-tag">'+(o.title||'程式價錢牌')+'</div><div class="code"></div></div>'+
   '<div class="side"><div class="mini-tag">📦 變量貨箱</div><div class="crates"></div>'+
   (o.noConsole?'':'<div class="mini-tag">🖥 輸出</div><div class="console" aria-live="polite"></div>')+
   (o.sideExtra?'<div class="extra"></div>':'')+'</div>'+
   '<div class="note" aria-live="polite"></div>'+
   (o.sideExtra||!o.extra?'':'<div class="extra full"></div>')+
   '<div class="ctrl"><button class="btn" data-a="reset">⏮ 重設</button><button class="btn" data-a="prev">◀ 上一步</button>'+
   '<button class="btn primary" data-a="next">下一步 ▶</button><button class="btn" data-a="play">⏵ 自動播放</button>'+
   '<label class="spd">速度 <input type="range" min="1" max="5" value="3" aria-label="播放速度"></label><span class="prog"></span></div>';
  const codeEl=$('.code',R), cr=$('.crates',R), con=$('.console',R), note=$('.note',R), ex=$('.extra',R), prog=$('.prog',R);
  const bPlay=$('[data-a=play]',R), bPrev=$('[data-a=prev]',R), bNext=$('[data-a=next]',R), spd=$('.spd input',R);
  let P=null, idx=-1, last=-1, timer=null;
  const delay=()=>[1500,1050,650,350,140][spd.value-1];
  function stop(){ clearInterval(timer); timer=null; bPlay.textContent='⏵ 自動播放'; }
  function fly(m){
    const a=cr.querySelector('[data-v="'+m.from+'"] .val'), b=cr.querySelector('[data-v="'+m.to+'"] .val');
    if(!a||!b||!a.animate) return;
    const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect(); if(!ra.width) return;
    const c=el('div','chip-fly',esc(String(m.val))); c.style.left=ra.left+'px'; c.style.top=ra.top+'px'; document.body.appendChild(c);
    const dx=rb.left-ra.left, dy=rb.top-ra.top;
    const an=c.animate([{transform:'translate(0,0)'},{transform:'translate('+dx/2+'px,'+(dy/2-38)+'px) scale(1.2)'},{transform:'translate('+dx+'px,'+dy+'px)'}],{duration:700,easing:'ease-in-out'});
    an.onfinish=()=>c.remove(); an.oncancel=()=>c.remove();
  }
  function render(){
    const fwd = idx===last+1;
    const st = idx>=0 ? P.steps[idx] : null;
    $$('.ln',codeEl).forEach(l=>l.classList.toggle('cur', !!st && +l.dataset.i===st.line));
    const cur=$('.ln.cur',codeEl); if(cur && timer==null){ /* keep code in view horizontally only */ }
    const vars = st ? st.vars : {};
    o.order.forEach(n=>{
      const c=cr.querySelector('[data-v="'+n+'"]'), v=$('.val',c), s=fmt(vars[n]);
      if(v.textContent!==s){ v.textContent=s; if(fwd && idx>=0 && s!=='—' && !RM){ c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); } }
      c.classList.toggle('empty', vars[n]===undefined);
    });
    if(con){ const out=st?st.out:[]; con.innerHTML = out.length? out.map(x=>'<div>'+esc(x)+'</div>').join('') : '<div class="dim">（未有輸出）</div>'; con.scrollTop=con.scrollHeight; }
    note.innerHTML = st ? st.note : (o.intro || '按「下一步 ▶」開始逐行執行。');
    prog.textContent = '步驟 '+(idx+1)+' / '+P.steps.length;
    if(st && st.move && fwd && !RM) fly(st.move);
    if(o.extra) o.extra(st, ex, P, idx);
    bPrev.disabled = idx<0; bNext.disabled = idx>=P.steps.length-1;
    last=idx;
  }
  function rebuild(){
    stop(); P=o.build(); codeEl.innerHTML=codeLines(P.lines);
    cr.innerHTML=o.order.map(n=>'<div class="crate empty" data-v="'+n+'"><div class="vn">'+n+'</div><div class="val">—</div></div>').join('');
    idx=-1; last=-1; render();
  }
  function step(){ if(idx<P.steps.length-1){ idx++; render(); } if(idx>=P.steps.length-1) stop(); }
  R.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]'); if(!b) return;
    const a=b.dataset.a;
    if(a==='next'){ stop(); step(); }
    else if(a==='prev'){ stop(); if(idx>-1){ idx--; render(); } }
    else if(a==='reset'){ stop(); idx=-1; last=-1; render(); }
    else if(a==='play'){ if(timer){ stop(); return; } if(idx>=P.steps.length-1){ idx=-1; last=-1; render(); }
      bPlay.textContent='⏸ 暫停'; timer=setInterval(step, delay()); }
  });
  spd.addEventListener('input',()=>{ if(timer){ clearInterval(timer); timer=setInterval(step, delay()); } });
  rebuild();
  return {rebuild};
}

    '</tbody></table></div>';

const trCount=makeTracer({mount:$('#trCount'), order:['count','i','item'], sideExtra:true, build(){

const trSum=makeTracer({mount:$('#trSum'), order:['total','i','item'], sideExtra:true, build(){
