<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>micro:bit 小實驗室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{
  --ws:#EEF1F5; --dot:#D3D9E2; --paper:#FFFFFF; --line:#D5DBE4;
  --ink:#1B2433; --ink-2:#5B6678;
  --basic:#1E90FF; --input:#D400D4; --logic:#00A4A6; --loops:#00AA00;
  --var:#DC143C; --music:#E63022; --neo:#2699BF;
  --run:#FFD400; --idle:#6F7A8C;
  --ok:#00A65A; --bad:#D93025;
  --mouth:#EEF1F5; --mouth-logic:#E8F7F7;
  --future:#DCE2EA; --hover:#AEB7C4; --dis-bg:#E3E7ED; --dis-ink:#8A94A6;
  --open-bg:#F3F5F8; --avatar:#FFE7A3; --light-hi:#F7E9A6;
  --pcb:#1B1D21; --led-on:#FF3B2F; --led-off:#5A2A26; --key:#0D0E10;
  --font:"Chiron GoRound TC","Noto Sans HK",sans-serif;
  --pop:cubic-bezier(.2,.9,.3,1.2);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font);font-size:22px;line-height:1.45;color:var(--ink);
  background-color:var(--ws);
  background-image:radial-gradient(circle,var(--dot) 1.5px,transparent 1.6px);
  background-size:22px 22px;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
.num,time{font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}

/* ---------- shell ---------- */
#app{display:grid;grid-template-rows:72px minmax(0,1fr) 104px;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--paper);border-bottom:1px solid var(--line);min-width:0}
.topbar .lesson-name{font-weight:700;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.topbar .spacer{flex:1}
.bottombar{display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--paper);border-top:1px solid var(--line)}
main{overflow:auto;padding:10px 32px 10px;position:relative}
.view-home .only-lesson,.view-lab .only-lesson{visibility:hidden}
.view-home .back{display:none}

/* ---------- buttons ---------- */
.btn{min-height:44px;min-width:44px;padding:6px 18px;border-radius:12px;border:2px solid var(--line);background:var(--paper);
  font-size:22px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 2px 0 var(--line);transition:transform .08s,box-shadow .08s,border-color .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.btn:hover{border-color:var(--hover)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:focus-visible,.focusable:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn.primary{background:var(--basic);border-color:var(--basic);color:var(--paper);box-shadow:0 2px 0 var(--ink-2)}
.btn.primary:hover{border-color:var(--ink)}
.btn[disabled]{background:var(--dis-bg);color:var(--dis-ink);border-color:var(--dis-bg);box-shadow:none;cursor:default;transform:none}
.btn.on{border-color:var(--ink);background:var(--open-bg)}
.btn.big{min-height:64px}
.btn.small{font-size:16px;min-height:44px;padding:4px 12px}
.icon-btn{width:48px;height:48px;padding:0}
.icon-btn svg{width:26px;height:26px}
.back{font-size:22px}

/* A / B keys */
.keybtn{height:64px;min-width:150px;padding:0 18px 0 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);
  display:inline-flex;align-items:center;gap:12px;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.keybtn .cap{width:40px;height:40px;border-radius:50%;background:var(--key);color:var(--paper);display:grid;place-items:center;font-size:22px;font-weight:700;box-shadow:inset 0 -3px 0 rgba(255,255,255,.12)}
.keybtn.next{padding:0 12px 0 18px;background:var(--basic);border-color:var(--basic);color:var(--paper);box-shadow:0 2px 0 var(--ink-2)}
.keybtn:hover{border-color:var(--hover)} .keybtn.next:hover{border-color:var(--ink)}
.keybtn:active{transform:translateY(2px);box-shadow:none}
.keybtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.keybtn[disabled]{background:var(--dis-bg);border-color:var(--dis-bg);color:var(--dis-ink);box-shadow:none;cursor:default}
.keybtn[disabled] .cap{background:var(--dis-ink)}
.view-home .keybtn,.view-lab .keybtn{visibility:hidden}

/* progress made of blocks */
.progress{display:flex;align-items:center;gap:10px}
.pblocks{display:flex}
.pb{width:38px;height:16px;background:var(--future);border-radius:3px;position:relative;margin-right:4px}
.pb::after{content:"";position:absolute;right:-6px;top:4px;width:8px;height:8px;border-radius:50%;background:inherit;z-index:1}
.pb:last-child::after{display:none}
.pb.done{background:var(--logic)} .pb.cur{background:var(--basic)}
.pcount{font-size:16px;font-weight:700;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}

/* teacher timer */
.timer{position:relative}
.timer-pill{height:44px;border-radius:999px;background:var(--ws);border:1px solid var(--line);padding:0 16px;display:flex;align-items:center;gap:10px;cursor:pointer;white-space:nowrap;font-size:16px;color:var(--ink-2)}
.timer-pill b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.timer-pill.over{border:3px solid var(--run);padding:0 14px}
.timer-pill:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.timer.hidden{display:none}
.timer-panel{position:absolute;right:0;top:54px;width:330px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;z-index:40;box-shadow:0 8px 24px rgba(27,36,51,.12)}
.timer-panel[hidden]{display:none}
.timer-panel h3{font-size:16px;color:var(--ink-2);margin-bottom:6px}
.timer-panel ol{list-style:none;margin:0 0 10px;padding:0}
.timer-panel li{display:flex;justify-content:space-between;font-size:16px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer-panel li.cur{font-weight:700;color:var(--ink)}
.timer-panel .row{display:flex;gap:8px;justify-content:space-between;align-items:center}
.timer-panel .row span{font-size:16px;color:var(--ink-2)}

/* 呂Sir helper */
.helper{flex:1;display:flex;align-items:center;gap:14px;min-width:0;justify-content:center}
.helper.hidden .bubble,.helper.hidden .avatar{visibility:hidden}
.avatar{width:60px;height:60px;border-radius:50%;background:var(--avatar);display:grid;place-items:center;font-weight:700;font-size:24px;flex:none;overflow:hidden;border:1.5px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.bubble{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:10px 18px;font-size:22px;max-width:640px;line-height:1.35}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;width:14px;height:14px;background:var(--paper);border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.tools{display:flex;gap:8px}

/* ---------- page ---------- */
.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:100%}
.page>h1{font-size:40px;line-height:1.15;font-weight:700}
.pop{animation:pop .22s var(--pop) both}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.slide-in-r{animation:slideR .26s ease-out both} .slide-in-l{animation:slideL .26s ease-out both}
@keyframes slideR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative}
.muted{color:var(--ink-2);font-size:16px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:700;border-radius:999px;padding:4px 12px;background:var(--ws);border:1px solid var(--line)}

/* category chip (small block with step number) */
.chip{align-self:flex-start;display:inline-block;position:relative;background:var(--c,var(--basic));color:var(--paper);font-weight:700;font-size:22px;padding:4px 14px;border-radius:6px;line-height:1.3}
.chip::before{content:"";position:absolute;left:12px;top:0;width:18px;height:5px;background:rgba(0,0,0,.18);border-radius:0 0 4px 4px}

/* ---------- home ---------- */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1}
.entry{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;
  transition:border-color .15s,transform .08s;min-height:200px}
.entry:hover{border-color:var(--hover)}
.entry:active{transform:translateY(2px)}
.entry:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.entry .band{height:22px;background:var(--c);position:relative}
.entry .band::after{content:"";position:absolute;left:28px;bottom:-8px;width:34px;height:10px;background:var(--c);border-radius:0 0 6px 6px}
.entry .body{display:flex;gap:20px;align-items:center;padding:24px 26px;flex:1}
.entry h2{font-size:40px;line-height:1.15}
.entry p{font-size:22px;margin-top:6px}
.entry .meta{font-size:16px;color:var(--ink-2);margin-top:8px;font-weight:700}
.entry svg{flex:none;width:140px;height:110px}

/* ---------- blocks ---------- */
.blocks{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.blk{--c:var(--basic);position:relative;background:var(--c);color:var(--paper);font-weight:700;font-size:24px;line-height:1.25;
  padding:12px 18px;border-radius:6px;display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;transition:outline-color .15s,box-shadow .15s,background-color .15s;outline:4px solid transparent;outline-offset:3px}
.blk::before{content:"";position:absolute;left:18px;top:0;width:22px;height:6px;background:rgba(0,0,0,.18);border-radius:0 0 4px 4px}
.cblk{--c:var(--basic);--m:var(--mouth);display:inline-flex;flex-direction:column;min-width:300px;max-width:100%}
.c-basic{--c:var(--basic)} .c-input{--c:var(--input)} .c-logic{--c:var(--logic)} .c-loops{--c:var(--loops)}
.c-var{--c:var(--var)} .c-music{--c:var(--music)} .c-neo{--c:var(--neo)}
.cblk.c-logic{--m:var(--mouth-logic)}
.chead,.cmid{position:relative;background:var(--c);color:var(--paper);font-weight:700;font-size:24px;line-height:1.25;padding:12px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  outline:4px solid transparent;outline-offset:3px;transition:outline-color .15s,box-shadow .15s,background-color .15s}
.chead{border-radius:6px 6px 6px 0}
.chead::before{content:"";position:absolute;left:18px;top:0;width:22px;height:6px;background:rgba(0,0,0,.18);border-radius:0 0 4px 4px}
.hat>.chead{border-radius:14px 14px 6px 0}
.hat>.chead::before{display:none}
.cmid{border-radius:0 6px 6px 0}
.cmouth{border-left:22px solid var(--c);background:var(--m);padding:6px 12px 6px 10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-height:44px;transition:border-color .15s}
.cfoot{height:18px;background:var(--c);border-radius:0 0 6px 6px;width:120px;transition:background-color .15s}
.cblk.collapsed>.cmouth,.cblk.collapsed>.cfoot{display:none}
.cblk.collapsed>.chead{border-radius:6px}
.p{background:var(--paper);color:var(--ink);border-radius:999px;padding:1px 14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;min-height:30px}
.p.num{border:2px solid var(--line)}
.p.sensor{background:var(--input);color:var(--paper);border:2px solid rgba(255,255,255,.55)}
.p.reporter{background:var(--neo);color:var(--paper);border:2px solid rgba(255,255,255,.55)}
.p.cmp{background:var(--logic);color:var(--paper);border:2px solid rgba(0,0,0,.22);padding:2px 8px}
.p.icon svg{width:30px;height:30px;display:block}
.dot{width:20px;height:20px;border-radius:50%;display:inline-block;border:2px solid var(--line);flex:none}
.p.more{min-width:44px;justify-content:center}
.run{outline-color:var(--run)!important;box-shadow:0 0 9px 7px color-mix(in srgb,var(--run) 25%,transparent)}
.idle{--c:var(--idle)}
.blk.idle{background:var(--idle)}
.blk.idle .p.sensor,.blk.idle .p.reporter{background:var(--idle)}
.cblk.collapsible>.chead{cursor:pointer}
.cblk.collapsible>.chead:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.more{background:var(--paper);color:var(--ink);border-radius:999px;padding:0 12px;font-size:16px;font-weight:700;line-height:28px}

/* ---------- sim layout ---------- */
.sim{display:grid;grid-template-columns:minmax(440px,620px) minmax(0,1fr);gap:24px;flex:1;min-height:0}
.sim .code{overflow:auto;padding:2px 6px 2px 8px}
.stagecard{background:var(--paper);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.stage{position:relative;flex:1;min-height:240px}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none;outline:none}
.stage .labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.stage .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);font-size:22px}
.lbl{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);font-size:16px;font-weight:700;border-radius:999px;padding:2px 10px;border:2px solid var(--c,var(--line));white-space:nowrap}
.lbl.below{transform:translate(-50%,0)}
.lbl.right{transform:translate(0,-50%)}
.lbl.pin{transform:translate(-50%,-50%);min-width:30px;text-align:center}
.result{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:3;pointer-events:none}
.result .pill{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 16px;font-size:22px;font-weight:700;white-space:nowrap}
.inputs{border-top:1px solid var(--line);padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.inrow{display:flex;align-items:center;gap:16px}
.bignum{font-size:44px;font-weight:700;line-height:1;min-width:92px;text-align:right;font-variant-numeric:tabular-nums;color:var(--input)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.fallback-note{position:absolute;left:12px;bottom:10px;font-size:16px;color:var(--ink-2);background:var(--paper);padding:2px 8px;border-radius:8px}
.fallback svg{position:absolute;inset:0;width:100%;height:100%}

/* sliders */
.slider{flex:1;position:relative;height:44px;display:flex;align-items:center;min-width:120px}
.slider input{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer}
.slider input::-webkit-slider-runnable-track{height:14px;border-radius:999px;background:var(--track)}
.slider input::-moz-range-track{height:14px;border-radius:999px;background:var(--track)}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;border-radius:50%;background:var(--paper);border:3px solid var(--input);margin-top:-13px;box-shadow:0 2px 4px rgba(27,36,51,.2)}
.slider input::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--paper);border:3px solid var(--input)}
.slider input:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:12px}
.slider input:disabled{cursor:default;opacity:1}
.slider.light{--track:linear-gradient(90deg,var(--ink),var(--light-hi))}
.slider.sound{--track:linear-gradient(90deg,var(--line),var(--input))}
.slider .mark{position:absolute;top:2px;bottom:2px;width:3px;background:var(--logic);pointer-events:none;margin-left:-1.5px}
.slider .mark span{position:absolute;top:-6px;left:6px;font-size:16px;font-weight:700;color:var(--logic);background:var(--paper);padding:0 4px;border-radius:4px;line-height:1.1}

/* ---------- lab ---------- */
.lab{display:grid;grid-template-columns:minmax(0,2fr) minmax(360px,1fr);gap:20px;flex:1;min-height:0}
.lab .stagecard{min-height:420px}
.controls{display:flex;flex-direction:column;gap:10px;overflow:auto;padding:2px 4px 2px 2px}
.controls h3{font-size:16px;color:var(--ink-2);font-weight:700;margin-top:4px}
.controls .btnrow .btn{flex:1 1 auto}
.ctlrow{display:flex;align-items:center;gap:10px}
.ctlrow .num{font-size:22px;font-weight:700;min-width:48px;text-align:right;color:var(--input)}
.partcard{position:absolute;left:12px;top:12px;width:min(340px,calc(100% - 24px));z-index:4;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;box-shadow:0 8px 24px rgba(27,36,51,.14)}
.partcard[hidden]{display:none}
.partcard h3{font-size:24px;margin-right:48px}
.partcard p{margin-top:6px}
.partcard .close{position:absolute;right:8px;top:8px}
.typetag{display:inline-flex;align-items:center;gap:8px;margin-top:10px;border-radius:999px;padding:4px 14px 4px 8px;font-weight:700;font-size:22px;color:var(--paper);background:var(--c)}
.typetag svg{width:26px;height:26px}
.typetag.t-plain{background:var(--ws);color:var(--ink);border:1px solid var(--line)}
.state-msg{font-size:22px;font-weight:700;display:flex;gap:8px;align-items:center}
.state-msg svg{width:28px;height:28px;flex:none}
.state-msg.ok{color:var(--ok)} .state-msg.bad{color:var(--bad)}
.stage-msg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:6px 18px;z-index:3;white-space:nowrap}
.stage-msg[hidden]{display:none}

/* ---------- intro ---------- */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;flex:1}
.intro .scene{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex}
.intro .scene svg{width:100%;height:auto;max-height:440px}
.question{font-size:40px;font-weight:700;line-height:1.3}
.qcard{display:flex;flex-direction:column;gap:18px}

/* ---------- IPO ---------- */
.ipo{display:grid;grid-template-columns:1fr 54px 1fr 54px 1fr;align-items:stretch}
.ipo .box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ipo .arrow{display:grid;place-items:center}
.ipo .arrow svg{width:40px;height:28px}
.ipo .box b{font-size:24px}

/* IPO explanation */
.ipo2{display:grid;grid-template-columns:120px 1fr 48px 1fr 48px 1fr;gap:20px 0;align-items:stretch}
.ipo2 .box{min-height:100px}
.ipo2 .def{padding:0 8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ipo2 .def p{font-size:22px;line-height:1.35}
.ipo2 .rowlab{align-self:center;font-size:24px}
.ipo2 .box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;outline:4px solid transparent;outline-offset:3px;transition:outline-color .15s,box-shadow .15s}
.ipo2 .box svg{width:48px;height:40px;flex:none}
.ipo2 .box b{font-size:24px;line-height:1.3}
.ipo2 .arrow{display:grid;place-items:center}.ipo2 .arrow svg{width:36px;height:26px}
.exled svg{width:44px;height:44px}
.exled.on .hon{fill:var(--led-on)}
.defrow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.defrow>div{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:8px 12px;font-size:22px;line-height:1.3}
.defrow .chip{flex:none}
.findlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.findlist li{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;font-size:16px;font-weight:700;min-height:36px}
.findlist .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:16px;flex:none;font-variant-numeric:tabular-nums}
.findlist .ok{margin-left:auto;width:22px;height:22px;color:var(--ok);visibility:hidden}
.findlist .ok svg{width:22px;height:22px}
.findlist li.found{border-color:var(--ok)}
.findlist li.found .ok{visibility:visible}
.controls h3 .found{color:var(--ink)}
.login{margin:0;padding-left:30px;display:flex;flex-direction:column;gap:4px}
.acct{font-size:24px;letter-spacing:.02em}
/* sort game */
.sort{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1;min-height:0}
.ipo2 .box.run{outline-color:var(--run);box-shadow:0 0 9px 7px color-mix(in srgb,var(--run) 25%,transparent)}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;align-items:flex-start}
.scard{min-height:56px;padding:8px 16px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:22px;cursor:grab;touch-action:none;user-select:none;display:inline-flex;align-items:center;gap:8px;box-shadow:0 2px 0 var(--line)}
.scard.sel{outline:3px solid var(--ink);outline-offset:2px}
.scard.placed-ok{border-color:var(--ok)}
.scard.placed-bad{border-color:var(--bad)}
.scard .mark{width:24px;height:24px}
.scard.dragging{opacity:.35}
.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-50%) rotate(-2deg);box-shadow:0 10px 24px rgba(27,36,51,.25)}
.bucket{background:var(--paper);border:2px dashed var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:150px;cursor:pointer}
.bucket.hot{border-style:solid;border-color:var(--ink);background:var(--open-bg)}
.bucket h3{font-size:24px;display:flex;align-items:center;gap:8px}
.bucket h3 svg{width:28px;height:28px;flex:none}
.bucket .slot{display:flex;flex-wrap:wrap;gap:8px}
.feedback{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px;min-height:30px}
.feedback svg{width:28px;height:28px;flex:none}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}

/* ---------- concept 2 / 3 ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1;min-height:0}
.varbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.box3d{width:240px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);position:relative;padding:22px 16px 18px;text-align:center}
.box3d .name{position:absolute;top:-20px;left:50%;transform:translateX(-50%);white-space:nowrap}
.box3d .v{font-size:44px;font-weight:700;color:var(--input);font-variant-numeric:tabular-nums;line-height:1.1}
.fork{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.fork .q{background:var(--logic);color:var(--paper);font-weight:700;font-size:24px;padding:12px 20px;border-radius:12px}
.fork .paths{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
.path{border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;background:var(--paper);transition:outline-color .15s,background-color .15s;outline:4px solid transparent;outline-offset:3px}
.path b{font-size:24px}
.path.idle{background:var(--idle);color:var(--paper);border-color:var(--idle)}
.bars{display:flex;gap:10px;background:var(--pcb);padding:12px 14px;border-radius:12px}
.bars i{width:52px;height:52px;border-radius:8px;background:var(--paper);display:block;transition:background-color .12s,box-shadow .12s}
.bars i.on{background:var(--led-on);box-shadow:0 0 12px var(--led-on)}
.bars.big i{width:78px;height:78px}

/* ---------- steps ---------- */
.steps{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:24px;flex:1;min-height:0}
.steptabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.steptabs .btn{min-width:64px}
.steptabs .btn.on{background:var(--basic);color:var(--paper);border-color:var(--basic)}
.stepcard{padding-top:18px;display:flex;flex-direction:column;gap:12px;min-height:330px}
.stepcard .chip{align-self:flex-start}
.stepcard h2{font-size:24px}
.stepcard ol{margin:0;padding-left:30px;display:flex;flex-direction:column;gap:6px}
.dl2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dl2 .card{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dl2 svg{width:100%;height:90px}
.ui-chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:10px;padding:2px 12px;font-weight:700;background:var(--paper)}
.faq{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:16px;background:var(--paper);overflow:hidden;align-self:start}
.faq h2{font-size:24px;padding:14px 18px 8px}
.faq details{border-top:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;min-height:56px;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"▼";font-size:16px;transition:transform .15s}
.faq details[open]{background:var(--open-bg)}
.faq details[open] summary::after{transform:rotate(180deg)}
.faq details>div{padding:0 18px 14px}
.faq ul{margin:0;padding-left:26px}

/* ---------- hints ---------- */
.hints{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.hint{padding-top:20px;min-height:300px;display:flex;flex-direction:column;gap:12px}
.hint .chip{align-self:flex-start}
.hint .closed{flex:1;display:grid;place-items:center}
.goal{display:flex;gap:18px;align-items:center}

/* ---------- quiz ---------- */
.quiz{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:24px;flex:1}
.qtext{font-size:24px;font-weight:700;margin:6px 0 12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:64px;justify-content:flex-start;text-align:left;padding:8px 18px}
.opt.right{border-color:var(--ok);border-width:3px}
.opt.wrong{border-color:var(--bad);border-width:3px}
.opt .mark{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:22px}
.opt .mark svg{width:26px;height:26px}
.ledside{display:flex;flex-direction:column;align-items:center;gap:16px;justify-content:center}
.minimb{background:var(--pcb);border-radius:14px;padding:18px 22px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px 16px;width:220px}
.minimb i{aspect-ratio:3/5;background:var(--led-off);border-radius:3px;display:block;transition:background-color .1s,box-shadow .1s}
.minimb i.on{background:var(--led-on);box-shadow:0 0 10px var(--led-on)}
.score{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;display:inline-flex;overflow:hidden;height:56px;line-height:56px}
.score .roll{display:inline-block;animation:roll .35s var(--pop)}
@keyframes roll{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
.qprog{display:flex;gap:8px}
.qprog i{width:28px;height:12px;border-radius:3px;background:var(--future);display:block}
.qprog i.cur{background:var(--basic)} .qprog i.done{background:var(--logic)}

/* ---------- summary ---------- */
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.keycard{padding-top:20px;display:flex;flex-direction:column;gap:10px}
.keycard p{font-size:22px}
.exit{display:flex;flex-direction:column;gap:12px}
.exit .opts{flex-direction:row;flex-wrap:wrap}
.exit .opt{min-height:56px}

/* checklist (show page) */
.checks{display:flex;flex-direction:column;gap:12px}
.check{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 16px;border:2px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;text-align:left;font-size:22px;font-weight:700}
.check .box{width:36px;height:36px;border:3px solid var(--ink);border-radius:8px;display:grid;place-items:center;flex:none}
.check .box svg{width:24px;height:24px;visibility:hidden}
.check[aria-pressed="true"] .box svg{visibility:visible}
.check[aria-pressed="true"]{border-color:var(--ok)}

/* page transition micro:bit */
.xfer{position:fixed;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;background:var(--pcb);border-radius:10px;padding:9px;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;z-index:90;pointer-events:none;opacity:0;transition:opacity .1s}
.xfer.show{opacity:1}
.xfer i{background:var(--led-off);border-radius:2px;display:block}
.xfer i.on{background:var(--led-on)}

.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:8px 20px;z-index:80;font-weight:700}
.toast[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1000px){
  .sim,.lab,.steps,.quiz,.two,.intro{grid-template-columns:1fr}
  .home-grid{grid-template-columns:1fr}
  .hints,.keys{grid-template-columns:1fr}
  .progress .pblocks{display:none}
  .bubble{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  .pop,.slide-in-r,.slide-in-l{animation:fade .15s both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .score .roll{animation:none}
  .btn:active,.keybtn:active,.entry:active{transform:none}
  *{scroll-behavior:auto!important}
}

<script type="module">

      T('A', -19.5, 7.4, 2.4); T('B', 19.5, 7.4, 2.4);

const AU = {
  ctx: null, muted: store.get('mute') === '1',
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx;
  },
  tone(f, d, type = 'square', when = 0, vol = .07) {
    if (this.muted) return; const c = this.ensure(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + when;
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .03);
  },
  melody() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, .17, 'square', i * .16)); },
  click() { this.tone(900, .04, 'square', 0, .03); },

const Mic = {
  stream: null, raf: 0,
  async start(cb, onFail) {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no');
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const c = AU.ensure() || new AudioContext(); const src = c.createMediaStreamSource(this.stream), an = c.createAnalyser();
      an.fftSize = 1024; src.connect(an); const buf = new Float32Array(an.fftSize);
      const loop = () => { an.getFloatTimeDomainData(buf); let s = 0; for (const v of buf) s += v * v;
        const rms = Math.sqrt(s / buf.length); cb(Math.max(0, Math.min(255, Math.round(rms * 900)))); this.raf = requestAnimationFrame(loop); };
      loop(); return true;
    } catch (e) { this.stop(); onFail && onFail(); return false; }
  },
  stop() { cancelAnimationFrame(this.raf); if (this.stream) this.stream.getTracks().forEach(t => t.stop()); this.stream = null; },
  get on() { return !!this.stream; }
};

function sortGame(el) {
  const pool = $('.pool', el), feedback = $('.feedback', el); let sel = null, drag = null, justDragged = false, left = SORT_ITEMS.length;
  const items = SORT_ITEMS.map((x, i) => ({ t: x[0], k: x[1], i }));
  pool.innerHTML = items.map(it => `<button class="scard" type="button" data-k="${it.k}" data-i="${it.i}">${it.t}</button>`).join('');
  const names = { input: '輸入', output: '輸出', process: '處理' };
  $$('.scard', el).forEach(card => {
    card.addEventListener('click', () => {
      if (justDragged) { justDragged = false; return; } if (card.disabled) return;
      sel = sel === card ? null : card; $$('.scard', el).forEach(c => c.classList.toggle('sel', c === sel)); AU.click();
    });
    card.addEventListener('pointerdown', e => {
      if (card.disabled) return; drag = { card, x: e.clientX, y: e.clientY, ghost: null, id: e.pointerId };
      card.setPointerCapture(e.pointerId);
    });
    card.addEventListener('pointermove', e => {
      if (!drag || drag.card !== card) return;
      if (!drag.ghost && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {
        drag.ghost = card.cloneNode(true); drag.ghost.classList.add('ghost'); document.body.appendChild(drag.ghost); card.classList.add('dragging');
      }
      if (drag.ghost) {
        drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
        const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('.bucket');
        $$('.bucket', el).forEach(b => b.classList.toggle('hot', b === t));
      }
    });
    const end = e => {
      if (!drag || drag.card !== card) return;
      if (drag.ghost) {
        drag.ghost.remove(); card.classList.remove('dragging'); justDragged = true; setTimeout(() => justDragged = false, 50);
        const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('.bucket');
        $$('.bucket', el).forEach(b => b.classList.remove('hot'));
        if (t) placeAndFix(card, t);
      }
      drag = null;
    };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
  });
  function placeAndFix(card, b) {
    const f = $$('.feedback', el).pop(); const ok = card.dataset.k === b.dataset.b;
    sel = null; $$('.scard', el).forEach(c => c.classList.remove('sel'));
    if (ok) {
      card.classList.add('placed-ok'); card.disabled = true; card.insertAdjacentHTML('afterbegin', `<span class="mark" style="color:var(--ok)">${IC.ok}</span>`);
      $('.slot', b).appendChild(card); left--; AU.ok();
      f.outerHTML = fb(true, left ? `答對了：${card.textContent} 是${names[b.dataset.b]}` : '全部答對了，8 張卡都放好了');
      if (!left) toast('8 張卡全部答對');
    } else {
      card.classList.add('placed-bad'); setTimeout(() => card.classList.remove('placed-bad'), 900); AU.no();
      f.outerHTML = fb(false, `再試一次：${card.textContent} 不是${names[b.dataset.b]}`);
    }
    $$('.feedback', el).pop().setAttribute('aria-live', 'polite');
  }
  $$('.bucket', el).forEach(b => {
    const go = () => { if (sel) placeAndFix(sel, b); else { const f = $$('.feedback', el).pop(); f.outerHTML = '<span class="feedback">先點一張卡，再點這一格。</span>'; } };
    b.addEventListener('click', e => { if (e.target.closest('.scard')) return; go(); });
    b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
}

const hsl2hex = (h, s, l) => { s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));

    $('[data-shake]', el).addEventListener('click', () => { const n = 1 + Math.floor(Math.random() * 6); Stage.shake(); AU.dice(); setTimeout(() => { HW.leds = pat(n); hwChanged(); res('骰仔：' + n); }, reducedMotion() ? 0 : 450); });
    const L = $('#labL', el), S = $('#labS', el);
    L.addEventListener('input', () => { HW.light = +L.value; $('[data-lv]', el).textContent = L.value; hwChanged(); });
    const sv = () => { HW.sound = +S.value; $('[data-sv]', el).textContent = S.value; };
    S.addEventListener('input', sv); wireMic(el, S, sv);
    const pb = $('[data-pow]', el); const powBtn = () => { pb.textContent = HW.power ? '電源：開' : '電源：關'; pb.setAttribute('aria-pressed', HW.power); pb.classList.toggle('on', HW.power); };
    pb.addEventListener('click', () => { HW.power = !HW.power; hwChanged(); powBtn(); AU.click(); });
    const asm = $('[data-asm]', el), link = $('[data-link]', el);
    asm.addEventListener('click', () => {
      if (HW.assembled) { HW.assembled = false; HW.stripLinked = false; Stage.setMode('mb'); if (has3D) Stage3D.mount(Stage.slot, Stage.opts); hwChanged(); asm.textContent = '組裝'; Stage.opts.onMsg(null); return; }
      asm.disabled = link.disabled = true; Stage.assemble(() => { asm.disabled = link.disabled = false; asm.textContent = '拆開'; });
    });
    link.addEventListener('click', () => { asm.disabled = link.disabled = true; Stage.linkStrip(() => { asm.disabled = link.disabled = false; asm.textContent = '拆開'; hwChanged(); }); });
  }
};

/* ================= TIMER ================= */
const Timer = {
  lesson: null, el: [], hidden: store.get('timerHidden') === '1', iv: 0,
  start(n) { if (this.lesson !== n) { this.lesson = n; this.el = LESSONS[n].segs.map(() => 0); } clearInterval(this.iv); this.iv = setInterval(() => this.tick(), 1000); this.render(); },
  stop() { clearInterval(this.iv); },
  tick() { if (R.lesson && !document.hidden) { this.el[R.cur.seg]++; this.render(); } },
  fmt(s) { const a = Math.abs(s); return `${a < 0 ? '' : ''}${String(Math.floor(a / 60)).padStart(2, '0')}:${String(a % 60).padStart(2, '0')}`; },
  render() {
    const box = $('#timer'); box.classList.toggle('hidden', this.hidden || !R.lesson); if (!R.lesson) return;
    const L = LESSONS[R.lesson], si = R.cur.seg, [nm, mins] = L.segs[si], left = mins * 60 - this.el[si];
    const pill = $('#timerPill'); pill.classList.toggle('over', left < 0);
    pill.innerHTML = `${nm} · 建議 ${mins} 分鐘　<b>${left < 0 ? '+' : ''}${this.fmt(left)}</b>`;
    $('#timerList').innerHTML = L.segs.map((s, i) => `<li class="${i === si ? 'cur' : ''}"><span>${s[0]}</span><span>建議 ${s[1]} 分鐘 · 已用 ${this.fmt(this.el[i])}</span></li>`).join('');
  }
};

/* ================= ROUTER / SHELL ================= */
const R = { view: 'home', lesson: 0, page: 0, get cur() { return LESSONS[this.lesson].pages[this.page]; } };
function setHelper(t) { $('#say').textContent = t; }
function xfer() {
  const x = $('#xfer'); const cells = $$('i', x);
  if (reducedMotion()) { cells.forEach((c, i) => c.classList.toggle('on', [6, 8, 10, 11, 12, 13, 14, 16, 17, 18, 22].includes(i))); x.classList.add('show'); setTimeout(() => x.classList.remove('show'), 150); return; }
  x.classList.add('show'); cells.forEach(c => c.classList.remove('on'));
  for (let col = 0; col < 5; col++) setTimeout(() => cells.forEach((c, i) => { if (i % 5 === col) c.classList.add('on'); }), col * 40);
  setTimeout(() => cells.forEach(c => c.classList.remove('on')), 230); setTimeout(() => x.classList.remove('show'), 300);
}
function render(dirn = 1) {
  Stage.unmount(); Mic.stop();
  const main = $('main'), app = $('#app');
  app.className = 'view-' + (R.view === 'lesson' ? 'lesson' : R.view);
  let page, title, say;
  if (R.view === 'home') {
    $('#lname').textContent = 'micro:bit 小實驗室'; title = 'micro:bit 小實驗室'; say = '揀一張卡開始。今日用 micro:bit 做小發明。';
    const cards = [['lab', 'basic', '3D 實驗室', '轉動 micro:bit，看清每個部件。', '自由探索'], ['1', 'input', '第 1 課', '認識 micro:bit：會思考的小電腦', '35 分鐘'], ['2', 'logic', '第 2 課', '智能夜燈：天黑自動亮', '35 分鐘'], ['3', 'neo', '第 3 課', '課室噪音警報燈條', '35 分鐘']];
    page = { html: `<div class="home-grid">${cards.map(c => `<button class="entry pop" type="button" data-go="${c[0]}" style="--c:var(--${c[1]})"><span class="band"></span><span class="body">${HOMEICON[c[0]]}<span><h2>${c[2]}</h2><p>${c[3]}</p><span class="meta">${c[4]}</span></span></span></button>`).join('')}</div>`,
      wire(el) { $$('[data-go]', el).forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.go === 'lab' ? '#/lab' : `#/${b.dataset.go}/1`; })); } };
  } else if (R.view === 'lab') { $('#lname').textContent = '3D 實驗室'; title = '3D 實驗室'; page = LAB; say = LAB.say; }
  else { const L = LESSONS[R.lesson]; page = R.cur; title = page.title; say = page.say; $('#lname').textContent = L.full; }
  main.innerHTML = `<div class="page ${dirn > 0 ? 'slide-in-r' : 'slide-in-l'}">${R.view === 'home' ? `<h1>${title}</h1>` : `<h1>${title}</h1>`}${page.html}</div>`;
  main.scrollTop = 0; setHelper(say);
  page.wire && page.wire(main.firstElementChild);
  document.title = (R.view === 'lesson' ? LESSONS[R.lesson].full.replace('　', ' ') + ' · ' : '') + 'micro:bit 小實驗室';
  // progress & nav
  if (R.view === 'lesson') {
    const n = LESSONS[R.lesson].pages.length;
    $('#pblocks').innerHTML = [...Array(n)].map((_, i) => `<span class="pb ${i < R.page ? 'done' : i === R.page ? 'cur' : ''}"></span>`).join('');
    $('#pcount').textContent = `${R.page + 1} / ${n}`;
    $('#prev').disabled = R.page === 0;
    $('#next .lbl2').textContent = R.page === n - 1 ? '完成' : '下一頁';
    Timer.start(R.lesson);
  } else { Timer.stop(); Timer.render(); }
}
function parse() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  if (h[0] === 'lab') { R.view = 'lab'; }
  else if (LESSONS[h[0]]) { R.view = 'lesson'; R.lesson = +h[0]; R.page = Math.max(0, Math.min(LESSONS[h[0]].pages.length - 1, (+h[1] || 1) - 1)); }
  else { R.view = 'home'; R.lesson = 0; }
}
let lastKey = '';
function onHash() {
  const before = lastKey; parse(); const key = R.view + R.lesson + '/' + R.page;
  const dir = before && R.view === 'lesson' && before.startsWith('lesson' + R.lesson) && +before.split('/')[1] > R.page ? -1 : 1;
  if (before && before !== key) xfer();
  lastKey = key; render(dir);
}
function go(d) {
  if (R.view !== 'lesson') return; const n = LESSONS[R.lesson].pages.length, p = R.page + d;
  AU.click();
  if (p >= n) { location.hash = '#/'; return; }
  if (p < 0) return; location.hash = `#/${R.lesson}/${p + 1}`;
}

/* ================= BOOT ================= */
document.body.insertAdjacentHTML('afterbegin', `<div id="app" class="view-home">
  <header class="topbar"><button class="btn back" type="button" id="back">← 返回</button><span class="lesson-name" id="lname"></span><span class="spacer"></span>
    <div class="progress only-lesson"><div class="pblocks" id="pblocks" aria-hidden="true"></div><span class="pcount" id="pcount"></span></div>
    <div class="timer only-lesson" id="timer"><button class="timer-pill" id="timerPill" type="button" aria-expanded="false" aria-controls="timerPanel" title="教師計時器（按 T 隱藏）"></button>
      <div class="timer-panel" id="timerPanel" hidden><h3>各環節建議時間（共 35 分鐘）</h3><ol id="timerList"></ol>
        <div class="row"><span>按 T 隱藏計時器</span><button class="btn small" type="button" id="timerReset">重設計時</button></div></div></div></header>
  <main id="main" tabindex="-1"></main>
  <footer class="bottombar"><button class="keybtn" id="prev" type="button" aria-label="上一頁"><span class="cap">A</span>上一頁</button>
    <div class="helper" id="helper"><div class="avatar" id="avatar">${AVATAR_SRC ? `<img src="${AVATAR_SRC}" alt="">` : '呂'}</div><p class="bubble" id="say" aria-live="polite"></p></div>
    <div class="tools"><button class="btn icon-btn" id="muteBtn" type="button"></button><button class="btn icon-btn" id="helpBtn" type="button" aria-pressed="true"></button></div>
    <button class="keybtn next" id="next" type="button" aria-label="下一頁"><span class="lbl2">下一頁</span><span class="cap">B</span></button></footer>
</div><div class="xfer" id="xfer" aria-hidden="true">${'<i></i>'.repeat(25)}</div><div class="toast" id="toast" hidden role="status"></div>`);
$('#back').addEventListener('click', () => { location.hash = '#/'; });
$('#prev').addEventListener('click', () => go(-1)); $('#next').addEventListener('click', () => go(1));
$('#timerPill').addEventListener('click', () => { const p = $('#timerPanel'); p.hidden = !p.hidden; $('#timerPill').setAttribute('aria-expanded', !p.hidden); });
$('#timerReset').addEventListener('click', () => { Timer.el = Timer.el.map(() => 0); Timer.render(); });
const muteUI = () => { const b = $('#muteBtn'); b.innerHTML = (AU.muted ? IC.mute : IC.sound) + `<span class="sr">${AU.muted ? '聲音：關' : '聲音：開'}</span>`; b.title = AU.muted ? '聲音已關（按一下打開）' : '聲音已開（按一下靜音）'; b.setAttribute('aria-pressed', AU.muted); };
$('#muteBtn').addEventListener('click', () => { AU.muted = !AU.muted; store.set('mute', AU.muted ? '1' : '0'); muteUI(); });
const helpUI = () => { const on = store.get('helper') !== '0'; $('#helper').classList.toggle('hidden', !on); const b = $('#helpBtn'); b.innerHTML = IC.helper + `<span class="sr">${on ? '隱藏呂Sir 小助手' : '顯示呂Sir 小助手'}</span>`; b.title = on ? '隱藏小助手' : '顯示小助手'; b.setAttribute('aria-pressed', on); };
$('#helpBtn').addEventListener('click', () => { store.set('helper', store.get('helper') === '0' ? '1' : '0'); helpUI(); });
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  if (e.key === 't' || e.key === 'T') { Timer.hidden = !Timer.hidden; store.set('timerHidden', Timer.hidden ? '1' : '0'); Timer.render(); }
});
document.addEventListener('pointerdown', () => AU.ensure(), { once: true });
window.addEventListener('hashchange', onHash);
muteUI(); helpUI(); onHash();

</script>
</body>
</html>
