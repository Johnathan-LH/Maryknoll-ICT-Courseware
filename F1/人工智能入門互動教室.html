<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人工智能入門互動教室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: a book on a projector. One concept per page; chapter tabs on top, page numbers and turn buttons at the bottom.
   Engine: HK school textbook + teacher's marking. Yellow highlighter only behind key terms, blue ballpoint for anything you can press, red pen only for marking. Single light theme on purpose (projectors wash out dark pages). */
:root{
  --paper:#FBFBF8;
  --paper-2:#F1F2EE;
  --ink:#17181C;
  --lead:#5A5E66;
  --rule:#D9DCE1;
  --blue:#2348B5;
  --blue-soft:#E4E9F7;
  --hl:#FFE357;
  --red:#D42C2C;
  --red-soft:#FBE9E7;
  --f-title:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",cursive;
  --f-code:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs:clamp(18px, 1.1vw + 10px, 28px);
  --line:2.5px;
  --r:6px;
  --barH:3.4rem;
  color-scheme:light;
}
html{font-size:var(--fs);height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.65;min-height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.stage:focus,.stage:focus-visible{outline:none}
a{color:var(--blue);text-underline-offset:.2em}
p{margin:0}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--paper);border-bottom:var(--line) solid var(--ink);display:flex;align-items:stretch;gap:1rem;padding-inline:clamp(16px,2vw,40px);min-height:var(--barH)}
.brand{display:flex;flex-direction:column;justify-content:center;line-height:1.15;flex:none}
.brand b{font-family:var(--f-title);font-weight:900;font-size:.95rem}
.brand span{font-family:var(--f-code);font-size:.55rem;color:var(--lead);letter-spacing:.08em}
.tabs{position:relative;display:flex;align-items:stretch;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;border:0;background:transparent;padding:.2rem .85rem;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;line-height:1.15;white-space:nowrap;color:var(--lead)}
.tab .k{font-family:var(--f-code);font-weight:600;font-size:.6rem}
.tab .t{font-weight:700;font-size:.72rem}
.tab[aria-selected="true"],.tab:hover{color:var(--ink)}
.tab-ind{position:absolute;bottom:0;height:7px;background:var(--hl);border-top:var(--line) solid var(--ink);border-inline:var(--line) solid var(--ink);transition:left .28s cubic-bezier(.3,.7,.2,1),width .28s cubic-bezier(.3,.7,.2,1)}
.tools{display:flex;align-items:center;gap:.5rem;flex:none}

/* ---------- page area ---------- */
.stage{overflow-x:clip;padding-block:1.6rem calc(var(--barH) + 2.4rem);padding-inline:clamp(16px,4vw,96px)}
.page{max-width:82rem;margin-inline:auto;display:flex;flex-direction:column;gap:1.3rem}
.page.enter-r{animation:enterR .34s cubic-bezier(.2,.7,.2,1)}
.page.enter-l{animation:enterL .34s cubic-bezier(.2,.7,.2,1)}
@keyframes enterR{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes enterL{from{transform:translateX(-48px);opacity:0}to{transform:none;opacity:1}}
.page.first [data-in]{animation:rise .42s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 60ms + 80ms)}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.ph{display:grid;gap:.25rem}
.kicker{display:flex;align-items:center;gap:.6rem;font-family:var(--f-code);font-weight:600;font-size:.62rem;color:var(--lead);letter-spacing:.06em}
.kicker .act{font-family:var(--f-body);font-weight:900;letter-spacing:0;font-size:.62rem;color:#fff;background:var(--blue);padding:.05rem .55rem;border-radius:3px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.ph h2{font-family:var(--f-title);font-weight:900;font-size:2.15rem;line-height:1.22}
.lead{color:var(--lead);max-width:46em}
h3{font-family:var(--f-title);font-weight:900;font-size:1.3rem;line-height:1.3}
h4{font-weight:900;font-size:1.02rem;line-height:1.35}

/* highlighter */
mark.hl{background:linear-gradient(transparent 52%, var(--hl) 52% 92%, transparent 92%) no-repeat 0 0/100% 100%;color:inherit;padding-inline:.08em;font-weight:700}
.page.first mark.hl{animation:swipe .55s cubic-bezier(.4,.1,.2,1) both;animation-delay:calc(var(--i,0) * 60ms + 380ms)}
@keyframes swipe{from{background-size:0% 100%}to{background-size:100% 100%}}

/* prose & rules */
.prose{display:grid;gap:.75rem;max-width:44em}
.prose ul,.prose ol{margin:0;padding-left:1.3em;display:grid;gap:.35rem}
.defn{font-size:1.35rem;line-height:1.55;font-weight:700;max-width:34em;border-left:6px solid var(--ink);padding-left:1rem}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(1rem,3vw,3rem);align-items:start}
.split.wide-l{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.rule-top{border-top:var(--line) solid var(--ink);padding-top:.7rem}
.note{font-size:.78rem;color:var(--lead)}
.hand{font-family:var(--f-hand);font-size:1.05rem;line-height:1.55;color:var(--blue)}
.margin{font-family:var(--f-hand);color:var(--blue);font-size:.95rem;line-height:1.5;border-left:2px dashed var(--blue);padding:.2rem 0 .2rem .9rem;max-width:46em}
.src{font-size:.62rem;color:var(--lead);font-family:var(--f-body)}

/* comparison table */
.cmp{width:100%;border-collapse:collapse}
.cmp th{font-family:var(--f-title);font-weight:900;font-size:1.1rem;text-align:left;padding:.4rem .8rem;border-bottom:var(--line) solid var(--ink)}
.cmp td{padding:.45rem .8rem;border-bottom:1px solid var(--rule);vertical-align:top}
.cmp td+td,.cmp th+th{border-left:var(--line) solid var(--ink)}
.cmp .rowh{font-weight:900;white-space:nowrap}

/* buttons: ballpoint blue, press down */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.3rem;padding:.3rem 1rem;border:var(--line) solid var(--ink);border-radius:var(--r);background:#fff;font-weight:700;font-size:.82rem;line-height:1.2;box-shadow:0 4px 0 var(--ink);transform:translateY(0);transition:transform .08s ease,box-shadow .08s ease,background .15s;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--blue-soft)}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:#1B3A99}
.btn.quiet{box-shadow:none;border-color:var(--rule);background:transparent}
.btn.quiet:active:not([disabled]){transform:translateY(1px)}
.btn.small{min-height:1.8rem;padding:.15rem .6rem;font-size:.7rem;box-shadow:0 3px 0 var(--ink)}
.btn.small:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.quiet.small{box-shadow:none}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn svg{width:1em;height:1em;flex:none}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.row .grow{flex:1}

/* red pen marks */
.pen{stroke:var(--red);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.pen-draw path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .38s ease-out forwards}
.pen-draw path+path{animation-delay:.16s}
@keyframes draw{to{stroke-dashoffset:0}}

/* Q&A block */
.qa{display:grid;gap:.5rem;border-top:var(--line) solid var(--ink);padding-top:.7rem}
.qa .q{display:grid;grid-template-columns:auto 1fr;gap:.6rem;font-weight:700}
.qa .q::before{content:"問";font-family:var(--f-title);font-weight:900;background:var(--ink);color:#fff;width:1.6rem;height:1.6rem;display:grid;place-items:center;border-radius:3px;font-size:.8rem;margin-top:.15rem}
.qa .a{font-family:var(--f-hand);color:var(--red);font-size:1.1rem;line-height:1.5;padding-left:2.2rem}
.qa .a.show{animation:rise .35s ease both}
.qa .ctl{padding-left:2.2rem}

/* ---------- bottom bar ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:var(--line) solid var(--ink);min-height:var(--barH);display:flex;align-items:center;gap:1rem;padding-inline:clamp(16px,2vw,40px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pages{display:flex;gap:.3rem;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;align-items:center;padding-block:.3rem}
.pages::-webkit-scrollbar{display:none}
.pg{flex:none;min-width:2.1rem;height:2.1rem;border:2px solid var(--rule);border-radius:4px;background:#fff;font-family:var(--f-code);font-weight:600;font-size:.62rem;color:var(--lead);display:grid;place-items:center;padding-inline:.3rem}
.pg.act{border-style:dashed;border-color:var(--blue);color:var(--blue)}
.pg.act::before{content:"活動 ";font-family:var(--f-body);font-weight:700}
.pg[aria-current="true"]{background:var(--ink);border:2px solid var(--ink);color:#fff}
.pg[aria-current="true"].act{background:var(--blue);border-color:var(--blue);border-style:solid;color:#fff}
.pnum{font-family:var(--f-code);font-weight:600;font-size:.66rem;color:var(--lead);white-space:nowrap}
.turn{display:flex;gap:.5rem}
.bump-r{animation:bumpR .28s ease}
.bump-l{animation:bumpL .28s ease}
@keyframes bumpR{50%{transform:translateX(12px)}}
@keyframes bumpL{50%{transform:translateX(-12px)}}

/* ---------- contents page ---------- */
.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:0 3rem}
.toc-item{display:grid;grid-template-columns:3.6rem 1fr auto;gap:.8rem;align-items:baseline;padding:.75rem 0;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:left;width:100%}
.toc-item:hover .tt{text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:3px;text-underline-offset:6px}
.toc-item .no{font-family:var(--f-code);font-weight:600;font-size:1.1rem}
.toc-item .tt{font-family:var(--f-title);font-weight:900;font-size:1.25rem;line-height:1.3}
.toc-item .acts{display:block;font-family:var(--f-body);font-weight:400;font-size:.72rem;color:var(--lead);margin-top:.15rem}
.toc-item .pp{font-family:var(--f-code);font-size:.7rem;color:var(--lead);white-space:nowrap}
.cover-title{font-family:var(--f-title);font-weight:900;font-size:3.4rem;line-height:1.15}
.cover-title small{display:block;font-family:var(--f-code);font-weight:600;font-size:.8rem;color:var(--lead);letter-spacing:.12em;margin-bottom:.4rem}

/* ---------- turing ---------- */
.question{font-size:1.3rem;font-weight:900;padding:.6rem 0;border-bottom:var(--line) solid var(--ink)}
.question[contenteditable="true"]{background:#FFFBE0;outline:2px dashed var(--blue);outline-offset:4px}
.cards6{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:1rem}
.tcard{perspective:1400px;min-height:13rem}
.tcard-inner{position:relative;height:100%;min-height:13rem;transition:transform .65s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.tcard.flipped .tcard-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:var(--line) solid var(--ink);border-radius:var(--r);background:#fff;padding:.8rem 1rem;display:flex;flex-direction:column;gap:.5rem;overflow:auto}
.face .lab{font-family:var(--f-code);font-size:.66rem;font-weight:600;color:var(--lead);display:flex;justify-content:space-between;align-items:center;gap:.4rem}
.face .ans{flex:1;font-size:.92rem;line-height:1.55}
.face .ans[contenteditable="true"]{outline:2px dashed var(--blue);outline-offset:3px;background:#FFFBE0}
.back{transform:rotateY(180deg);align-items:center;justify-content:center;text-align:center}
.back.is-ai{background:var(--ink);color:#fff}
.back.is-ai .lab{color:#B9BEC8}
.back.is-human{background:repeating-linear-gradient(0deg,#fff 0 1.9rem,var(--rule) 1.9rem calc(1.9rem + 1px))}
.verdict{font-family:var(--f-title);font-size:2.1rem;font-weight:900;line-height:1.1}
.back .tally{font-family:var(--f-code);font-size:.75rem}
.vote{display:flex;align-items:center;gap:.5rem;font-size:.72rem}
.count{font-family:var(--f-code);font-weight:600;font-size:1.25rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.toggle-ai{font-size:.66rem;border:2px solid var(--rule);border-radius:999px;padding:.05rem .6rem;background:#fff}
.toggle-ai[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.edit-banner{background:#FFFBE0;border:2px dashed var(--blue);border-radius:var(--r);padding:.5rem .9rem;font-size:.78rem}
.big-num{font-family:var(--f-code);font-weight:600;font-size:3rem;line-height:1}
.fact{display:grid;grid-template-columns:auto 1fr;gap:1.2rem;align-items:center;border-top:var(--line) solid var(--ink);border-bottom:var(--line) solid var(--ink);padding-block:.9rem}
.diagram svg{width:100%;height:auto;max-width:44rem}

/* waves */
.waves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.wave{position:relative;border:var(--line) solid var(--ink);border-left-width:0;padding:.8rem 1rem 1rem;display:grid;gap:.4rem;align-content:start;background:#fff;text-align:left}
.wave:first-child{border-left-width:var(--line);border-radius:var(--r) 0 0 var(--r)}
.wave:last-child{border-radius:0 var(--r) var(--r) 0}
.wave .yr{font-family:var(--f-code);font-weight:600;font-size:.72rem;color:var(--lead)}
.wave .nm{font-family:var(--f-title);font-weight:900;font-size:1.45rem;line-height:1.2}
.wave .what{font-size:.86rem}
.wave .out{font-family:var(--f-hand);font-size:1rem;line-height:1.45;color:var(--red);border-top:1px dashed var(--rule);padding-top:.4rem;margin-top:.2rem}
.wave.cur{background:var(--blue-soft)}
.wave .stamp{position:absolute;top:.5rem;right:.6rem;font-weight:900;font-size:.62rem;border:2px solid currentColor;color:var(--red);padding:0 .35rem;border-radius:3px;transform:rotate(6deg)}
.wave .stamp.go{color:var(--blue)}
.chain3{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:.6rem;align-items:stretch}
.chain3 .node{border:var(--line) solid var(--ink);border-radius:var(--r);padding:.6rem .8rem;display:grid;gap:.25rem;background:#fff;align-content:start}
.chain3 .node b{font-family:var(--f-title);font-weight:900;font-size:1.15rem}
.chain3 .node small{font-size:.72rem;color:var(--lead)}
.chain3 .arr{align-self:center;font-family:var(--f-code);font-weight:600;font-size:1.4rem}
.who{display:grid;grid-template-columns:auto 1fr;gap:.15rem .5rem;font-size:.8rem;margin:0}
.who dt{font-weight:900}
.who dd{margin:0}

/* sorter */
.sorter{display:flex;flex-direction:column;gap:1rem}
.pool{min-height:4.6rem;display:flex;flex-wrap:wrap;gap:.6rem;align-content:flex-start;padding:.7rem;border:2px dashed var(--rule);border-radius:var(--r)}
.pool:empty::after{content:"全部卡片已放好，可以按「批改」。";color:var(--lead);font-size:.78rem;align-self:center}
.bins{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,11.5rem),1fr))}
.bin{display:flex;flex-direction:column;border:var(--line) solid var(--ink);border-radius:var(--r);background:#fff;min-height:11rem;min-width:0}
.bin-head{border-bottom:var(--line) solid var(--ink);padding:.4rem .7rem;display:flex;justify-content:space-between;gap:.4rem;align-items:baseline;flex-wrap:wrap}
.bin-head span{font-family:var(--f-title);font-weight:900;font-size:1rem}
.bin-head small{font-size:.6rem;color:var(--lead)}
.bin-drop{flex:1;display:flex;flex-direction:column;gap:.5rem;padding:.6rem;transition:background .15s}
.over{background:var(--blue-soft)!important}
.target-ready .bin-drop,.target-ready.pool{outline:3px dashed var(--blue);outline-offset:-7px}
.dcard{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border:2px solid var(--ink);border-radius:5px;padding:.4rem .7rem;font-size:.82rem;line-height:1.35;font-weight:700;cursor:grab;box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;gap:.25rem;max-width:100%}
.dcard:active{cursor:grabbing}
.dcard.selected{background:var(--hl);box-shadow:0 0 0 3px var(--blue)}
.dcard.dragging-src{opacity:.25}
.dcard .why{display:none;font-weight:400;font-size:.7rem;color:var(--lead);border-top:1px dashed var(--rule);padding-top:.25rem}
.dcard.graded .why{display:block}
.dcard .mark{display:none;font-family:var(--f-hand);font-size:.9rem;color:var(--red);font-weight:700}
.dcard.graded .mark{display:block}
.dcard .tick{position:absolute;top:-.8rem;right:-.6rem;width:2.1rem;height:2.1rem}
.dcard.wrong{border-style:dashed;box-shadow:none;background:var(--red-soft)}
.dcard.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.drag-ghost{position:fixed;z-index:1000;pointer-events:none;transform:rotate(-2deg);box-shadow:0 12px 24px rgba(23,24,28,.25)}
.score{font-family:var(--f-code);font-weight:600;font-size:.95rem}

/* domain explorer */
.dom{display:grid;grid-template-columns:minmax(12rem,16rem) minmax(0,1fr);gap:2rem;align-items:start}
.dom-list{display:grid;border-top:var(--line) solid var(--ink)}
.dom-list button{display:grid;grid-template-columns:2rem 1fr;gap:.5rem;align-items:baseline;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:.6rem .4rem}
.dom-list button .n{font-family:var(--f-code);font-weight:600;color:var(--lead)}
.dom-list button .t{font-family:var(--f-title);font-weight:900;font-size:1.15rem}
.dom-list button[aria-selected="true"]{background:var(--hl)}
.dom-list button[aria-selected="true"] .n{color:var(--ink)}
.dom-panel{display:grid;gap:1rem}
.says{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
.say{border:var(--line) solid var(--ink);border-radius:var(--r);padding:.8rem 1rem;display:grid;gap:.3rem;background:#fff;align-content:start}
.say .who2{font-family:var(--f-code);font-size:.62rem;font-weight:600;color:var(--lead)}
.say p{font-weight:700}
.say.pc{background:var(--ink);color:#fff}
.say.pc .who2{color:#B9BEC8}

/* dilemma */
.dil{display:grid;gap:1rem}
.road{border:var(--line) solid var(--ink);border-radius:var(--r);background:#fff;overflow:hidden}
.road svg{display:block;width:100%;height:auto}
.choices{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
.choice{border:var(--line) solid var(--ink);border-radius:var(--r);padding:.8rem 1rem;display:grid;gap:.5rem;background:#fff;align-content:start}
.choice .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.choice .lbl b{font-family:var(--f-title);font-weight:900;font-size:1.2rem}
.choice .lbl span{font-family:var(--f-code);font-size:.62rem;color:var(--lead)}
.choice p{font-size:.92rem}
.vbar{height:2.2rem;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden;position:relative}
.vbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--blue) 0 8px,#3B5FCC 8px 16px);transition:width .35s ease}
.vbar.alt i{background:repeating-linear-gradient(90deg,var(--ink) 0 6px,#33363D 6px 12px)}
.vbar b{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);font-family:var(--f-code);font-size:.85rem;background:#fff;border:1.5px solid var(--ink);border-radius:4px;padding:0 .35rem;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:.3rem;flex-wrap:wrap}
.steps span{font-family:var(--f-code);font-size:.66rem;font-weight:600;border:2px solid var(--rule);border-radius:4px;min-width:1.8rem;text-align:center;padding:.05rem .3rem;color:var(--lead)}
.steps span.on{border-color:var(--ink);background:var(--ink);color:#fff}
.steps span.done{border-color:var(--ink);color:var(--ink)}
.sumtbl{width:100%;border-collapse:collapse;font-size:.85rem}
.sumtbl th,.sumtbl td{border-bottom:1px solid var(--rule);padding:.4rem .5rem;text-align:left;vertical-align:top}
.sumtbl th{border-bottom:var(--line) solid var(--ink);font-weight:900}
.sumtbl td.num{font-family:var(--f-code);white-space:nowrap}

/* vision */
.vision{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.4rem;align-items:start}
.viewer{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--ink);border-radius:var(--r);overflow:hidden;display:grid;place-items:center;color:#B9BEC8;text-align:center;border:var(--line) solid var(--ink)}
.viewer video,.viewer canvas{width:100%;height:100%;object-fit:contain}
.viewer .empty{padding:1rem;font-size:.82rem}
.viewer.drop-hover{outline:4px dashed var(--hl);outline-offset:-10px}
.results{display:flex;flex-direction:column;gap:.7rem}
.res{display:grid;gap:.25rem}
.res .rw{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline}
.res .name{font-weight:900;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.res .en{font-family:var(--f-code);font-size:.6rem;color:var(--lead);display:block;font-weight:500}
.res .pct{font-family:var(--f-code);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
.bar{height:1.1rem;border:2px solid var(--ink);border-radius:4px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--blue) 0 8px,#3B5FCC 8px 16px);transition:width .6s ease}
.res:nth-child(2) .bar i{background:repeating-linear-gradient(45deg,#7A8FCF 0 8px,#8DA0D7 8px 16px)}
.res:nth-child(3) .bar i{background:repeating-linear-gradient(45deg,#B3BEDF 0 8px,#C2CCE6 8px 16px)}
.status{font-size:.78rem;color:var(--lead);min-height:1.4em}
.spinner{display:inline-block;width:1em;height:1em;border:3px solid var(--rule);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;vertical-align:-.15em;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}
.warn{border:2px dashed var(--red);background:var(--red-soft);border-radius:var(--r);padding:.7rem .9rem;font-size:.82rem}
.warn strong{color:var(--red)}

/* speech */
.seg{display:inline-flex;position:relative;border:var(--line) solid var(--ink);border-radius:var(--r);background:#fff;padding:3px}
.seg button{position:relative;z-index:1;border:0;background:transparent;padding:.2rem .9rem;font-weight:700;font-size:.78rem;border-radius:3px;transition:color .2s}
.seg button[aria-selected="true"]{color:#fff}
.seg .knob{position:absolute;top:3px;bottom:3px;left:3px;background:var(--ink);border-radius:3px;transition:left .25s cubic-bezier(.3,.7,.2,1),width .25s cubic-bezier(.3,.7,.2,1)}
.mic{width:5.4rem;height:5.4rem;border-radius:50%;border:var(--line) solid var(--ink);background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.mic:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.mic svg{width:2.3rem;height:2.3rem}
.mic.on{background:var(--red);color:#fff;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 4px 0 var(--ink),0 0 0 0 rgba(212,44,44,.45)}100%{box-shadow:0 4px 0 var(--ink),0 0 0 22px rgba(212,44,44,0)}}
.transcript{min-height:8rem;font-size:1.9rem;font-weight:900;line-height:1.4;border-top:var(--line) solid var(--ink);border-bottom:var(--line) solid var(--ink);padding:.8rem 0;overflow-wrap:anywhere}
.transcript .interim{color:var(--lead);font-weight:400}
.transcript .ph{color:var(--lead);font-weight:400;font-size:1rem}
.idiom{font-family:var(--f-title);font-size:4rem;font-weight:900;letter-spacing:.2em;text-align:center;line-height:1.2}
.compare{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap;min-height:3.6rem}
.compare span{font-size:2.1rem;font-weight:900;width:3.1rem;height:3.5rem;display:grid;place-items:center;border:2px solid var(--ink);border-radius:5px;background:#fff;position:relative}
.compare span.miss{border-style:dashed;background:var(--red-soft)}
.compare span.miss::after{content:"✗";position:absolute;top:-.7rem;right:-.5rem;font-family:var(--f-hand);font-size:1.1rem;color:var(--red);font-weight:700}
.verdict2{text-align:center;font-family:var(--f-hand);color:var(--red);font-size:1.4rem;font-weight:700;min-height:1.6em}

/* vote */
.votes{display:grid;gap:.6rem}
.vrow{display:grid;grid-template-columns:minmax(6rem,11rem) minmax(0,1fr) auto;gap:.8rem;align-items:center}
.vrow .whoq{font-weight:900}
.vctl{display:flex;gap:.35rem}
.vrow:nth-child(2) .vbar i{background:repeating-linear-gradient(90deg,var(--ink) 0 6px,#33363D 6px 12px)}
.vrow:nth-child(3) .vbar i{background:radial-gradient(circle,var(--blue) 2px,var(--blue-soft) 2.5px) 0 0/10px 10px}
.vrow:nth-child(4) .vbar i{background:var(--hl)}
.vrow:nth-child(5) .vbar i{background:repeating-linear-gradient(0deg,#6B7080 0 5px,#8D919C 5px 10px)}
.risks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:var(--line) solid var(--ink)}
.risk{padding:.8rem 1.1rem .9rem 0;display:grid;gap:.35rem;align-content:start}
.risk+.risk{border-left:1px solid var(--rule);padding-left:1.1rem}
.risk .k{font-family:var(--f-code);font-size:.62rem;color:var(--lead)}
.risk p{font-size:.88rem}

/* prompt challenge */
.pc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.6rem;align-items:start}
.taskcard{border:var(--line) solid var(--ink);border-radius:var(--r);background:#fff;padding:.9rem 1.1rem;display:grid;gap:.5rem;box-shadow:0 4px 0 var(--ink)}
.taskcard .no{font-family:var(--f-code);font-weight:600;font-size:.66rem;color:var(--lead)}
.taskcard .scene{font-family:var(--f-title);font-weight:900;font-size:1.3rem;line-height:1.45}
.slots{display:grid;gap:.6rem}
.slot{display:grid;grid-template-columns:5.4rem 1fr;gap:.6rem;align-items:start}
.slot .sl{font-weight:900;font-size:.8rem;padding-top:.15rem;line-height:1.3}
.slot .sl small{display:block;font-weight:400;font-size:.6rem;color:var(--lead)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:.05rem .65rem;font-size:.72rem;font-weight:700;transition:background .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.promptbox{width:100%;min-height:6rem;resize:vertical;border:var(--line) solid var(--ink);border-radius:var(--r);padding:.6rem .8rem;font-family:var(--f-code);font-size:.8rem;line-height:1.5;background:#fff}
.checklist{display:grid;gap:0;margin:0;padding:0;list-style:none}
.checklist li button{width:100%;display:grid;grid-template-columns:2rem 1fr;gap:.5rem;align-items:center;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:.4rem 0;font-size:.92rem}
.checklist .box{width:1.5rem;height:1.5rem;border:2px solid var(--ink);border-radius:3px;position:relative;background:#fff}
.checklist .box svg{position:absolute;left:-.3rem;top:-.55rem;width:2.3rem;height:2.3rem}
.toast{font-family:var(--f-hand);color:var(--blue);font-size:.92rem;min-height:1.4em;overflow-wrap:anywhere}

/* face game */
.rounds{display:flex;flex-wrap:wrap;gap:.45rem}
.rounds .rd{width:2.6rem;height:2.6rem;border:2px solid var(--rule);border-radius:5px;display:grid;place-items:center;position:relative;font-family:var(--f-code);font-size:.6rem;color:var(--lead)}
.rounds .rd svg{position:absolute;inset:.1rem;width:calc(100% - .2rem);height:calc(100% - .2rem)}
.rounds .rd.set{border-color:var(--ink)}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:0 2rem;margin:0;padding:0;list-style:none}
.tips li{display:grid;grid-template-columns:1.8rem 1fr;gap:.4rem;padding:.45rem 0;border-bottom:1px solid var(--rule);font-size:.88rem}
.tips li b{font-family:var(--f-code);font-weight:600;color:var(--lead)}

/* IoT */
.iot{display:grid;grid-template-columns:minmax(0,14rem) minmax(0,1fr);gap:1.6rem;align-items:start}
.binwrap{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.binwrap svg{width:100%;max-width:12rem;height:auto}
.reading{font-family:var(--f-code);font-weight:600;font-size:1.5rem;font-variant-numeric:tabular-nums;text-align:center;line-height:1.2}
.reading small{display:block;font-size:.6rem;color:var(--lead);font-weight:500}
input[type=range]{width:100%;accent-color:var(--blue);height:2.2rem}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.3rem;position:relative}
.station{position:relative;border:2px solid var(--rule);border-radius:var(--r);background:#fff;padding:.6rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.25rem;transition:border-color .3s,background .3s}
.station svg{width:2.4rem;height:2.4rem}
.station .t{font-weight:900;font-size:.86rem;line-height:1.25}
.station .d{font-size:.62rem;color:var(--lead);line-height:1.35}
.station:not(:last-child)::after{content:"→";position:absolute;right:-1.15rem;top:50%;transform:translateY(-50%);font-family:var(--f-code);font-weight:600;color:var(--rule)}
.station.lit{border-color:var(--ink);background:var(--hl)}
.station.done{border-color:var(--ink)}
.station.done:not(:last-child)::after{color:var(--ink)}
.packet{position:absolute;width:1rem;height:1rem;border-radius:50%;background:var(--blue);border:2px solid var(--ink);top:-.6rem;left:0;opacity:0;transition:left .6s ease,opacity .2s}
.alertbox{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:center;border:var(--line) solid var(--ink);background:var(--hl);border-radius:var(--r);padding:.9rem 1.1rem;animation:pop .45s ease}
.alertbox svg{width:2.8rem;height:2.8rem}
.log{font-family:var(--f-code);font-size:.62rem;color:var(--lead);display:flex;flex-direction:column;gap:.1rem;max-height:6.5rem;overflow:auto}

/* areas */
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:var(--line) solid var(--ink)}
.area{padding:.9rem 1.2rem .9rem 0;display:grid;gap:.35rem;align-content:start;border-bottom:1px solid var(--rule)}
.area:nth-child(even){padding-left:1.2rem;border-left:1px solid var(--rule)}
.area .k{font-family:var(--f-code);font-size:.62rem;color:var(--lead)}
.area p{font-size:.88rem}
.boxed{border:var(--line) solid var(--ink);border-radius:var(--r);padding:.8rem 1rem;display:grid;gap:.35rem;background:#fff}
.boxed .tag{font-weight:900;font-size:.74rem}
.flow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2rem;counter-reset:f}
.flow3.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.flow3 > div{border-top:var(--line) solid var(--ink);padding-top:.5rem;display:grid;gap:.25rem;align-content:start}
.flow3 > div::before{counter-increment:f;content:"步驟 " counter(f);font-family:var(--f-code);font-size:.62rem;font-weight:600;color:var(--lead)}
.flow3 .eg{font-family:var(--f-hand);color:var(--blue);font-size:.95rem}

/* quiz */
.qtext{font-family:var(--f-title);font-size:1.55rem;font-weight:900;line-height:1.35;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}
.opt{position:relative;display:grid;grid-template-columns:2.4rem 1fr;gap:.7rem;align-items:center;border:var(--line) solid var(--ink);border-radius:var(--r);background:#fff;padding:.65rem .9rem;font-size:1.02rem;font-weight:700;line-height:1.35}
.opt .L{font-size:1.2rem;display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:4px;background:var(--ink);color:#fff}
.opt .ring{position:absolute;inset:-.55rem -.45rem;width:calc(100% + .9rem);height:calc(100% + 1.1rem);pointer-events:none;overflow:visible}
.opt .ring ellipse{stroke-dasharray:1300;stroke-dashoffset:1300;animation:drawLong .55s ease-out forwards}
@keyframes drawLong{to{stroke-dashoffset:0}}
.opt .ok{position:absolute;right:.8rem;bottom:-.1rem;transform:translateY(50%);background:var(--paper);padding:0 .3rem;font-family:var(--f-hand);color:var(--red);font-weight:700;font-size:.95rem}
.opt.dim{opacity:.4}
.teams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem}
.team{border:var(--line) solid var(--ink);border-radius:var(--r);background:#fff;padding:.5rem .7rem;display:grid;gap:.3rem;text-align:center}
.team .tn{font-weight:900;font-size:.86rem;border-bottom:1px dashed var(--rule);outline:none}
.team .tn:focus{background:#FFFBE0}
.team .ts{font-family:var(--f-code);font-weight:600;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;display:inline-block}
.team .ts.roll{animation:roll .3s ease}
@keyframes roll{from{transform:translateY(-40%);opacity:.2}to{transform:none;opacity:1}}
.team .tb{display:flex;gap:.3rem;justify-content:center}
.board{display:grid;gap:.6rem}
.brow{display:grid;grid-template-columns:3rem minmax(5rem,10rem) minmax(0,1fr);gap:.8rem;align-items:center}
.brow .rk{font-family:var(--f-code);font-weight:600;font-size:1.4rem;text-align:center}
.brow .nm{font-weight:900;font-size:1.05rem}
.brow.first .rk{background:var(--hl);border:2px solid var(--ink);border-radius:5px}
.summary{display:grid;counter-reset:s;border-top:var(--line) solid var(--ink);margin:0;padding:0;max-width:52em}
.summary li{list-style:none;display:grid;grid-template-columns:3rem 1fr;gap:.6rem;padding:.75rem 0;border-bottom:1px solid var(--rule)}
.summary li::before{counter-increment:s;content:counter(s,decimal-leading-zero);font-family:var(--f-code);font-weight:600;color:var(--lead);font-size:1.1rem}

/* responsive */
@media (max-width:1100px){
  .vision,.iot,.pc-grid,.split,.split.wide-l,.dom{grid-template-columns:1fr}
  .risks{grid-template-columns:1fr}
  .risk+.risk{border-left:0;padding-left:0;border-top:1px solid var(--rule)}
  .flow3.four{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:800px){
  .brand{display:none}
  .waves{grid-template-columns:1fr}
  .wave,.wave:first-child,.wave:last-child{border-left-width:var(--line);border-radius:0;border-top-width:0}
  .wave:first-child{border-top-width:var(--line);border-radius:var(--r) var(--r) 0 0}
  .wave:last-child{border-radius:0 0 var(--r) var(--r)}
  .chain3{grid-template-columns:1fr}
  .chain3 .arr{transform:rotate(90deg);justify-self:center}
  .chain{grid-template-columns:repeat(2,minmax(0,1fr))}
  .station:not(:last-child)::after{display:none}
  .teams{grid-template-columns:repeat(2,minmax(0,1fr))}
  .areas{grid-template-columns:1fr}
  .area:nth-child(even){padding-left:0;border-left:0}
  .flow3,.flow3.four{grid-template-columns:1fr}
  .says,.choices{grid-template-columns:1fr}
  .pnum{display:none}
  .turn .btn{padding-inline:.6rem}
}
@media (max-width:560px){
  .opts{grid-template-columns:1fr}
  .vrow{grid-template-columns:1fr;gap:.3rem}
  .idiom{font-size:2.5rem}
  .ph h2{font-size:1.55rem}
  .cover-title{font-size:2.2rem}
  .fact{grid-template-columns:1fr}
  .slot{grid-template-columns:1fr}
  .toc-item{grid-template-columns:3rem 1fr}
  .toc-item .pp{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- stickers: hand-drawn die-cut stickers + mascot 智智 ---------- */
.stk{display:inline-block;flex:none;width:var(--sz,5rem);height:var(--sz,5rem);transform:rotate(var(--rot,-4deg));cursor:pointer;vertical-align:middle;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(1px 3px 0 rgba(23,24,28,.22))}
.stk svg{display:block;width:100%;height:100%;overflow:visible;animation:stkBob 4.2s ease-in-out infinite;animation-delay:calc(var(--d,0) * -1s)}
.stk.still svg{animation:none}
.stk .eye{transform-box:fill-box;transform-origin:center;animation:stkBlink 4.6s infinite}
@keyframes stkBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(1.6deg)}}
@keyframes stkBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes stkPop{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.2) rotate(calc(var(--rot,-4deg) + 7deg))}100%{transform:scale(1) rotate(var(--rot,-4deg))}}
@keyframes stkWig{0%,100%{transform:rotate(var(--rot,-4deg)) scale(1)}20%{transform:rotate(calc(var(--rot,-4deg) - 16deg)) scale(1.12)}45%{transform:rotate(calc(var(--rot,-4deg) + 13deg)) scale(1.12)}70%{transform:rotate(calc(var(--rot,-4deg) - 6deg)) scale(1.04)}}
.page.first .stk,.stk.pop-in{animation:stkPop .62s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(.3s + var(--d,0) * 80ms)}
.stk.wig,.page.first .stk.wig{animation:stkWig .6s ease-out;animation-delay:0s}

/* page header with a sticker on the right */
.ph.has-stk{grid-template-columns:minmax(0,1fr) auto;column-gap:1rem;align-items:center;min-height:5.2rem}
.ph.has-stk>.kicker,.ph.has-stk>h2{grid-column:1}
.ph-stk{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:.4rem;position:relative}
.ph-stk.hero{width:15rem;height:10rem;display:block}
.ph-stk.hero .stk{position:absolute}

/* mascot speech bubble row at the end of a page */
.mrow{display:flex;align-items:center;gap:1.1rem;margin-top:.4rem}
.bub{position:relative;background:#fff;border:var(--line) solid var(--ink);border-radius:16px;padding:.55rem 1rem;font-family:var(--f-hand);font-size:1.08rem;line-height:1.5;box-shadow:3px 3px 0 var(--ink);max-width:42em}
.bub::before{content:"";position:absolute;left:-.62rem;top:50%;width:.9rem;height:.9rem;background:#fff;border-left:var(--line) solid var(--ink);border-bottom:var(--line) solid var(--ink);transform:translateY(-50%) rotate(45deg)}
.bub b{color:var(--blue);margin-right:.25rem}
.page.first .mrow .bub{animation:bubIn .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:.95s;transform-origin:left center}
@keyframes bubIn{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}

/* praise toast + confetti */
.praise{position:fixed;left:50%;bottom:calc(var(--barH) + 1.6rem);z-index:70;display:flex;align-items:center;gap:1rem;pointer-events:none;transform:translateX(-50%);animation:praiseIn .55s cubic-bezier(.3,1.5,.5,1) both;max-width:94vw}
.praise .bub{font-size:1.35rem;font-weight:700;padding:.7rem 1.3rem;box-shadow:4px 4px 0 var(--ink)}
.praise.out{opacity:0;transition:opacity .4s}
@keyframes praiseIn{from{transform:translate(-50%,40px) scale(.6);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.cf{position:absolute;display:block;border-radius:2px;will-change:transform}
.cf.k2{border-radius:50%}
.cf svg{width:100%;height:100%;display:block}

/* decoration hooks */
.toc-item{grid-template-columns:3.6rem 3.6rem 1fr auto;align-items:center}
.toc-item .stk{--sz:3rem}
.dom-list button{grid-template-columns:2rem 2.8rem 1fr;align-items:center}
.dom-list button .stk{--sz:2.5rem}
.dom-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.who2{display:inline-flex;align-items:center;gap:.4rem}
.bin-head .bh{display:inline-flex;align-items:center;gap:.45rem}
.area{position:relative}
.area.has-stk{padding-right:5rem}
.area.has-stk>.stk{position:absolute;right:.9rem;top:.7rem;--sz:3.2rem}
.areas .area:nth-child(even).has-stk>.stk{right:.2rem}
.chain3 .node{position:relative}
.chain3 .node>.stk{position:absolute;right:.6rem;top:.5rem;--sz:2.6rem}
.chain3 .node.has-stk{padding-right:3.6rem}
.wave>.stk.lead-stk{justify-self:start;--sz:3.3rem;margin-bottom:.1rem}
.h3-flex{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.flow3 h4 .stk{--sz:2rem;margin-right:.45rem;vertical-align:-.55rem}
.boardcrown{display:inline-block}
.brow .nm .stk{--sz:1.9rem;margin-right:.35rem;vertical-align:-.45rem}

@media (max-width:700px){
  .ph-stk .stk{width:3.6rem;height:3.6rem}
  .ph-stk.hero{width:6.4rem;height:6rem}
  .ph-stk.hero .stk:not(:first-child){display:none}
  .ph-stk.hero .stk:first-child{width:5.6rem;height:5.6rem;left:0!important;top:.2rem!important}
  .ph.has-stk{min-height:0}
  .mrow .stk{width:3.4rem;height:3.4rem}

/* ============ sorter: drag, or tap card then tap column ============ */

  }
